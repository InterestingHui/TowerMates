<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TowerMates · 魔塔原型</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">TOWER<span>MATES</span></div>
    <div class="floor-name" id="floorName">第 1 层 · 塔之入口</div>
    <div class="chips">
      <div class="chip hp"><span class="ico">❤️</span><b id="statHp">1000</b></div>
      <div class="chip"><span class="ico">⚔️</span><b id="statAtk">10</b></div>
      <div class="chip"><span class="ico">🛡️</span><b id="statDef">10</b></div>
      <div class="chip"><span class="ico">💰</span><b id="statGold">0</b></div>
      <div class="chip"><span class="ico">⭐</span><b id="statLv">Lv.1</b><small id="statExp">0/15</small></div>
    </div>
    <div class="keys">
      <span class="keytag ky">黄 <b id="keyY">1</b></span>
      <span class="keytag kb">蓝 <b id="keyB">0</b></span>
      <span class="keytag kr">红 <b id="keyR">0</b></span>
    </div>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
  </main>

  <footer id="bottom">
    <div id="log"></div>
    <div id="dpad">
      <button data-dir="up" aria-label="上">▲</button>
      <button data-dir="left" aria-label="左">◀</button>
      <button data-dir="down" aria-label="下">▼</button>
      <button data-dir="right" aria-label="右">▶</button>
    </div>
  </footer>
</div>

<!-- 开始 -->
<div class="overlay show" id="startOverlay">
  <div class="panel start-panel">
    <div class="logo">TOWER<span>MATES</span></div>
    <p class="sub">魔塔原型 · v0.1</p>
    <p class="desc">爬塔、打怪、算伤害。<br>每一场战斗都要算清楚再打。</p>
    <button class="btn primary" id="btnNew">开始游戏</button>
    <button class="btn" id="btnContinue" style="display:none">继续游戏</button>
    <button class="btn ghost" id="btnReset">清空存档</button>
    <p class="hint">键盘 ↑↓←→ / WASD 移动 · 点击格子移动 · 遇到怪物会弹出战斗预览</p>
  </div>
</div>

<!-- 战斗预览 -->
<div class="overlay" id="battleOverlay">
  <div class="panel battle-panel">
    <div class="enemy">
      <div class="enemy-emoji" id="btEmoji">🦇</div>
      <div class="enemy-name" id="btName">蝙蝠</div>
      <div class="enemy-stats" id="btStats">HP 30 · ATK 8 · DEF 1</div>
    </div>
    <div class="calc" id="btCalc">
      <div class="row"><span>你的攻击</span><b id="btOut">—</b></div>
      <div class="row"><span>战斗回合</span><b id="btRounds">—</b></div>
      <div class="row danger"><span>预计损失生命</span><b id="btLoss">—</b></div>
      <div class="row"><span>战后剩余</span><b id="btAfter">—</b></div>
      <div class="row reward"><span>战利品</span><b id="btReward">—</b></div>
    </div>
    <p class="warn" id="btWarn"></p>
    <div class="actions">
      <button class="btn" id="btCancel">离开</button>
      <button class="btn primary" id="btFight">战斗</button>
    </div>
  </div>
</div>

<!-- 商店 -->
<div class="overlay" id="shopOverlay">
  <div class="panel shop-panel">
    <div class="shop-head">
      <div class="shop-title">🏪 流浪商人</div>
      <div class="shop-gold">金币 <b id="shopGold">0</b></div>
    </div>
    <div class="shop-list" id="shopList"></div>
    <div class="actions">
      <button class="btn primary" id="shopClose">离开商店</button>
    </div>
  </div>
</div>

<!-- 结局 -->
<div class="overlay" id="endOverlay">
  <div class="panel end-panel">
    <div class="end-emoji" id="endEmoji">👸</div>
    <h2 id="endTitle">公主获救了</h2>
    <p id="endDesc"></p>
    <div class="end-stats" id="endStats"></div>
    <div class="actions">
      <button class="btn primary" id="btnAgain">再来一局</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
