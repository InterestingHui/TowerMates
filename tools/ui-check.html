<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>TowerMates UI check</title>
<script>
// 自动化场景不触发新手提示，保持被测画面干净
try { localStorage.setItem('towermates_tips_v2', JSON.stringify({
  walk:1, fight:1, block:1, blocksave:1, low:1, relic:1, goal:1, echo:1, ring:1, tooStrong:1, opening:1, finalLedger:1
})); } catch (e) {}
</script>
</head>
<body>
<iframe id="f" src="../index.html?play=1" style="width:430px;height:900px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
// iframe 被缓存时 load 可能早于本脚本执行：补一次就绪兜底，避免 run 永不触发。
// 环境慢或多会话并发时 boot 会超过固定延迟 → 改为轮询 Engine.state()，最多等 12s；
// 真起不来（脚本报错）也照样交给 run，让 out.booted=false 如实暴露问题。
(function () {
  var fr = document.getElementById('f'), kicked = false;
  function ready() {
    try { return !!(fr.contentWindow && fr.contentWindow.Engine && fr.contentWindow.Engine.state()); }
    catch (e) { return false; }
  }
  function kick() {
    if (kicked) return;
    kicked = true;
    var t0 = Date.now();
    (function poll() {
      if (ready() || Date.now() - t0 > 12000) { setTimeout(run, 80); return; }
      setTimeout(poll, 50);
    })();
  }
  fr.addEventListener('load', kick);
  if (fr.contentDocument && fr.contentDocument.readyState === 'complete') kick();
})();
async function run() {
  var out = {};
  try {
    var f = document.getElementById('f');
    var w = f.contentWindow, d = f.contentDocument;
    var E = w.Engine, s = E.state();
    out.booted = !!s;
    out.modules = { touch: !!w.TouchGestures, challenge: !!w.Challenge, wx: !!w.WXBridge };
    w.localStorage.removeItem('towermates_board');
    w.localStorage.removeItem('towermates_rivals');

    // 一次性往前开一层：拿钥匙、停在首层、最高层为 0
    s.flags['relic_gate'] = true;
    s.flags.maxFloor = 0;
    out.gateForthRaw = E.gateForth();
    w.__tm.openGate();
    var btn = d.getElementById('gateForthBtn');
    var tip = d.getElementById('gateForthTip');
    out.gateBtn = btn ? btn.textContent : null;
    out.gateTip = tip ? tip.textContent : null;
    out.gateEnabled = btn ? !btn.disabled : false;
    if (btn && !btn.disabled) { btn.click(); btn.click(); }
    var s2 = E.state();
    out.afterFloor = s2.floor;
    out.gateForthUsed = s2.flags.gateForth === true;
    out.sealCount = ((s2.flags || {}).gateSeals || []).length;

    // 挑战码：生产环境里的编解码与贴码进榜闭环
    var code = w.Challenge.encode({ ending: 'plain', vow: 'mercy', floor: 9, level: 12, steps: 500, time: 400, seal: 'ward', goals: 3 });
    out.codeLen = code.length;
    var dec = w.Challenge.decode(code);
    out.codeFloor = dec ? dec.floor : 0;
    out.codeSeal = dec ? dec.seal : '';
    out.codeGoals = dec ? dec.goals : 0;
    out.noScore = !!(dec && dec.score === undefined);
    var input = d.getElementById('pasteCode');
    out.pasteMax = input ? Number(input.maxLength) : 0;
    if (input) {
      input.value = code;
      d.getElementById('btnPasteCode').click();
      var rival = d.querySelector('#boardList .bd-row.rival');
      out.rivalRow = rival ? rival.textContent.replace(/\s+/g, ' ').trim().slice(0, 80) : null;
      // 幽灵行只要进榜即可（文案随版本演进：名字列显示楼层，分数在行尾）
      out.rivalScore = !!(rival && rival.textContent.indexOf('挑战·朋友') >= 0);
      out.rivalFloor = !!(rival && /9\s*层/.test(rival.textContent));
      // 同一行同一个数只该出现一次：楼层由「N层」列交代，名字列不再重复
      var rc = rival ? rival.querySelector('.bd-floor') : null;
      var rn = rival ? rival.querySelector('.bd-name') : null;
      out.rivalFloorCell = rc ? rc.textContent.replace(/\s+/g, '') : null;
      out.rivalNameCell = rn ? rn.textContent.replace(/\s+/g, '') : null;
      out.rivalNameNoFloor = !!rn && rn.textContent.indexOf('层') < 0;
    }

    // 今日一塔：朋友贴进来的码带了今天的日签，才该进「今日」档
    var todayKey = w.Daily.keyOf(Date.now());
    var dcode = w.Challenge.encode({
      ending: 'plain', vow: 'none', floor: 4, level: 6, steps: 120, time: 90,
      seal: '', goals: 0, margin: '', daily: todayKey,
    });
    out.dailyCodeLen = dcode.length;
    var ddec = w.Challenge.decode(dcode);
    out.dailyCodeDay = !!ddec && ddec.daily === todayKey;
    var inp2 = d.getElementById('pasteCode');
    if (inp2) {
      inp2.value = dcode;
      d.getElementById('btnPasteCode').click();
      var dtab = d.querySelector('#boardTabs .btab[data-f="daily"]');
      out.dailyTabs = d.querySelectorAll('#boardTabs .btab').length;
      if (dtab) dtab.click();
      var drow = d.querySelector('#boardList .bd-row.rival');
      out.dailyRows = d.querySelectorAll('#boardList .bd-row').length;
      out.dailyRival = !!(drow && /4\s*层/.test(drow.textContent));
      var atab = d.querySelector('#boardTabs .btab[data-f="all"]');
      if (atab) atab.click();
      // 普通局的码（v4，没有日签）不该进今日档
      var plain = w.Challenge.encode({ ending: 'plain', vow: 'none', floor: 6, level: 8, steps: 200, time: 150 });
      out.plainDay = (w.Challenge.decode(plain) || {}).daily === '';
      inp2.value = plain;
      d.getElementById('btnPasteCode').click();
      var dtab2 = d.querySelector('#boardTabs .btab[data-f="daily"]');
      if (dtab2) dtab2.click();
      out.dailyRowsAfterPlain = d.querySelectorAll('#boardList .bd-row').length;
      var atab2 = d.querySelector('#boardTabs .btab[data-f="all"]');
      if (atab2) atab2.click();
    }

    // 挑战链接（社交面）：把剪贴板换成探针，点一下看「真正被复制到的是什么」。
    // 只断言「按钮在」是假绿——要断言那串被复制出去的东西带码、且还落在同一个页面上。
    var linkBtn = d.getElementById('btnCopyLink');
    var myCodeEl = d.getElementById('myCode');
    out.rivalBtn = !!(linkBtn && linkBtn.getBoundingClientRect().width > 40);
    if (linkBtn && myCodeEl) {
      myCodeEl.textContent = code;           // 造出「已经通关过」的状态（探针不该依赖真实通关）
      var copied = null;
      try {
        Object.defineProperty(w.navigator, 'clipboard', {
          configurable: true,
          value: { writeText: function (t) { copied = t; return Promise.resolve(); } },
        });
      } catch (e) { out.rivalStub = String(e); }
      linkBtn.click();
      await new Promise(function (r) { setTimeout(r, 20); });
      out.rivalCopiedHasCode = !!copied && copied.indexOf('rival=' + code) > 0;
      out.rivalCopiedSamePage = !!copied && copied.indexOf(w.location.origin + w.location.pathname) === 0;
      out.rivalCopiedLen = copied ? copied.length : 0;
      var logBox = d.getElementById('log');
      out.rivalLog = logBox && logBox.lastChild ? logBox.lastChild.textContent.trim().slice(0, 32) : '';
      // 还没通关时点它：占位符「—— 通关后生成 ——」不该被拼成一条垃圾链接发出去
      myCodeEl.textContent = '—— 通关后生成 ——';
      copied = null;
      linkBtn.click();
      await new Promise(function (r) { setTimeout(r, 20); });
      out.rivalNoCodeCopied = copied;
      var logBox0 = d.getElementById('log');
      out.rivalNoCodeLog = logBox0 && logBox0.lastChild ? logBox0.lastChild.textContent.trim() : '';
    }

    // 落地链路真跑一遍：另起一个 iframe 带着 ?rival=<码> 开门，看它会不会自己收下、
    // 以及会不会把参数留在地址栏（留着的话刷新一次就重复收一次、提示也重复弹）。
    var landCode = w.Challenge.encode({
      ending: 'plain', vow: 'mercy', floor: 7, level: 9, steps: 300, time: 220, seal: 'ward', goals: 1,
    });
    var f2 = document.createElement('iframe');
    f2.style.cssText = 'width:400px;height:700px;border:0;position:absolute;left:-9999px;top:0';
    f2.src = '../index.html?rival=' + landCode;
    document.body.appendChild(f2);
    var landed = false, tLand = Date.now();
    while (Date.now() - tLand < 9000) {
      try {
        var list2 = JSON.parse(w.localStorage.getItem('towermates_rivals') || '[]');
        if (list2.some(function (x) { return x.code === landCode; })) { landed = true; break; }
      } catch (e) {}
      await new Promise(function (r) { setTimeout(r, 60); });
    }
    await new Promise(function (r) { setTimeout(r, 120); });
    out.rivalLandTaken = landed;
    try {
      out.rivalLandFloor = landed
        ? (JSON.parse(w.localStorage.getItem('towermates_rivals') || '[]')
          .filter(function (x) { return x.code === landCode; })[0] || {}).floor
        : null;
      out.rivalLandParam = String(f2.contentWindow.location.search || '');
      // 冲参数不能顺手把别的参数冲掉（线上链接带 sharecode，冲掉就打不开）
      var f3href = w.View.withoutRival('https://x.test/?sharecode=AAA&rival=' + landCode + '#demo=1,2,3');
      out.rivalStrip = f3href;
    } catch (e) { out.rivalLandErr = String(e && e.message || e); }
    if (f2.parentNode) f2.parentNode.removeChild(f2);

    // 自己贴自己的码：不许当朋友进榜。
    // 贴的必须是「自己另一局」而不是名录第一局——旧实现只跟第一局比字符串，拿第一局测会假绿。
    var selfCode = w.Challenge.encode({
      ending: 'plain', vow: 'greed', floor: 11, level: 15, steps: 700, time: 900,
      seal: 'name', goals: 2, margin: 'A',
    });
    w.localStorage.setItem('towermates_board', JSON.stringify([
      { ending: 'true', vow: 'none', floor: 12, level: 18, steps: 1500, time: 3000, seal: 'clear', goals: 4, margin: 'S', daily: '' },
      { ending: 'plain', vow: 'greed', floor: 11, level: 15, steps: 700, time: 900, seal: 'name', goals: 2, margin: 'A', daily: '' },
    ]));
    // 榜单要先按新名录重画一次，否则量到的是上一帧的 DOM（贴自己的码会被拒，界面不再重绘）
    var allTabX = d.querySelector('#boardTabs .btab[data-f="all"]');
    if (allTabX) allTabX.click();
    await new Promise(function (r) { setTimeout(r, 100); });
    var inp4 = d.getElementById('pasteCode');
    inp4.value = selfCode;
    d.getElementById('btnPasteCode').click();
    var warnNow = d.getElementById('warnPill');
    out.selfWarn = warnNow ? warnNow.textContent.replace(/\s+/g, '') : '';
    var selfRows = [].filter.call(d.querySelectorAll('#boardList .bd-row'), function (r) {
      return /11\s*层/.test(r.textContent);
    });
    out.selfBoardRows = selfRows.length;
    out.selfRivalRows = selfRows.filter(function (r) { return r.classList.contains('rival'); }).length;
    out.selfPasteCleared = inp4.value === '';

    // 榜单誓约档：六条誓约各有一档（此前只覆盖 4 条，苦行 / 无名两档的局在榜上无处可看）
    var tabIds = [].map.call(d.querySelectorAll('#boardTabs .btab'), function (b) { return b.dataset.f; });
    out.tabIds = tabIds.join(',');
    out.tabCount = tabIds.length;
    var ascCode = w.Challenge.encode({ ending: 'plain', vow: 'ascetic', floor: 7, level: 10, steps: 300, time: 260 });
    var inp3 = d.getElementById('pasteCode');
    inp3.value = ascCode;
    d.getElementById('btnPasteCode').click();
    var atabA = d.querySelector('#boardTabs .btab[data-f="ascetic"]');
    out.hasAscTab = !!atabA;
    if (atabA) atabA.click();
    var ascRows = d.querySelectorAll('#boardList .bd-row');
    out.ascRows = ascRows.length;
    out.ascOnly = ascRows.length === 1 && /7\s*层/.test(ascRows[0].textContent)
      && /苦/.test(ascRows[0].textContent);
    var ntab = d.querySelector('#boardTabs .btab[data-f="nameless"]');
    out.hasNamelessTab = !!ntab;
    if (ntab) ntab.click();
    out.namelessRows = d.querySelectorAll('#boardList .bd-row').length;
    out.namelessEmpty = (d.getElementById('boardList').textContent || '').indexOf('这一档还没有人') >= 0;
    var atab3 = d.querySelector('#boardTabs .btab[data-f="all"]');
    if (atab3) atab3.click();
    out.allRowsAfterVowTabs = d.querySelectorAll('#boardList .bd-row').length;

    // 点一次远处的怪物：应自动走到跟前并直接开打，不需要第二次点击
    // （先把上面榜单测试留下的浮层收干净——浮层开着时人不许走，这是 2026-11-16 新立的规矩）
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });
    E.newGame();
    var s3 = E.state();
    var target = null;
    for (var yy = 0; yy < 11 && !target; yy++) {
      for (var xx = 0; xx < 11 && !target; xx++) {
        var ch3 = E.tile(xx, yy);
        var mo = w.GAME_DATA.monsters[ch3];
        if (!mo || mo.ghost || mo.boss) continue;
        if (Math.abs(xx - s3.x) + Math.abs(yy - s3.y) < 2) continue;
        var reachable = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(function (o) {
          var pp = E.pathTo(xx + o[0], yy + o[1]);
          return !!(pp && pp.length);
        });
        if (reachable) target = { x: xx, y: yy, ch: ch3 };
      }
    }
    out.clickTarget = target ? target.x + ',' + target.y : null;
    if (target) {
      s3.atk = 999; s3.def = 999; s3.hp = 99999; s3.maxHp = 99999;
      // blocksave 教学是一次性对白（Tips 存 localStorage），测试里预标记已读
      try { var tk = Object.keys(W.localStorage).filter(function(k){return /tip/i.test(k);}); tk.forEach(function(k){ var o=JSON.parse(W.localStorage.getItem(k)||'{}'); o.blocksave=1; W.localStorage.setItem(k, JSON.stringify(o)); }); } catch(e){}
      out.clickDist = Math.abs(target.x - s3.x) + Math.abs(target.y - s3.y);
      var kills0 = s3.flags.killCount || 0;
      w.__tm.clickMove(target.x, target.y);
      await new Promise(function (r) { setTimeout(r, 3200); });
      var s4 = E.state();
      out.clickKills = (s4.flags.killCount || 0) - kills0;
      out.clickCleared = E.tile(target.x, target.y) !== target.ch;
      out.clickOnTile = s4.x === target.x && s4.y === target.y;
      // 打法归属的接线：这一场什么都没按 → dec 该记 n（引擎给归属，UI 只负责计数）
      out.clickDecN = (s4.flags.dec || {}).n || 0;
    }

    // 打法归属 dec 的「自动挡」桶（f）：只有格挡才能活的那一场，玩家没按任何打法，
    // 结算时由系统替他把盾举起来保命。这条规则原来只写在 UI 的三元表达式里、靠代码自觉，
    // 这里造出「白打必死、挡完能活」的真实一场，走完点击 → 面板 → 结算整条路，再读账本。
    // 判据：dec.f 记 1、dec.b 记 0（自动挡不许混进玩家的格挡率）。
    out.decAuto = {};
    (function () { w.__battleSpeed = 14; })();     // 演出提速：只压动画，不改数值
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });
    E.newGame();
    var sf = E.state();
    sf.flags.hasBlock = true;
    sf.floor = 0;
    var pick = null;
    for (var py = 1; py < 10 && !pick; py++) {
      for (var px = 1; px < 10 && !pick; px++) {
        var chP = sf.maps[0][py][px];
        var moP = w.GAME_DATA.monsters[chP];
        if (!moP || moP.ghost || moP.boss) continue;
        // 找一格紧邻它的可站立格（人物站上去就是「贴脸」，点一下即开打）
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (o) {
          if (pick) return;
          var ax = px + o[0], ay = py + o[1];
          if (ax < 1 || ax > 9 || ay < 1 || ay > 9) return;
          if (sf.maps[0][ay][ax] !== '.') return;
          var wDmg = E.fightDamage(chP, false);
          var bDmg = E.fightDamage(chP, true);
          if (!wDmg || wDmg.damage === null || !bDmg || bDmg.damage === null) return;
          pick = { x: px, y: py, hx: ax, hy: ay, white: wDmg.damage, block: bDmg.damage, vx: -o[0], vy: -o[1] };
        });
      }
    }
    if (pick && pick.block < pick.white) {
      sf.x = pick.hx; sf.y = pick.hy;
      sf.hp = pick.white - 1;               // 白打必死
      sf.maxHp = Math.max(sf.maxHp, pick.white);
      w.__tm.refreshHud();
      await new Promise(function (r) { setTimeout(r, 60); });
      out.decAuto.predBlockSave = !!(E.predictOpt(E.tile(pick.x, pick.y), true) || {}).blockSave;
      w.__tm.clickMove(pick.x, pick.y);
      var t0 = Date.now(), panelUp = false;
      while (Date.now() - t0 < 2500) {
        if (d.getElementById('battleScene').classList.contains('show')) { panelUp = true; break; }
        await new Promise(function (r) { setTimeout(r, 40); });
      }
      out.decAuto.panelUp = panelUp;
      // 什么都不按，直接点面板跳过 → 结算（系统自带的那一记挡）
      d.getElementById('battleScene').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      t0 = Date.now();
      while (Date.now() - t0 < 2500) {
        var decNow = (E.state().flags || {}).dec || {};
        if (decNow.f || decNow.b || decNow.n) break;
        await new Promise(function (r) { setTimeout(r, 40); });
      }
      var decA = (E.state().flags || {}).dec || {};
      out.decAuto.f = decA.f || 0;
      out.decAuto.b = decA.b || 0;
      out.decAuto.n = decA.n || 0;
      out.decAuto.hpLeft = Math.round(E.state().hp);
      out.decAuto.white = pick.white;
    }
    w.__battleSpeed = 1;
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });

    // 战斗面板提示行改口（2026-11-15 20:5x）：三把打法互斥，按下任一把之后另外两把只是 disabled、
    // onclick 仍挂在上面——旧判据于是继续说「可点下面的打法」，而面板上已经一个能点的都没有
    // （点了没反应，是死按钮的另一种写法）。这里走真实链路：第 5 层那一战 → 按格挡 → 读提示行。
    // 2026-11-15 21:5x：三把同屏的层从第 4 层后移到第 5 层（缠斗拆到第 5 层才出现），探针跟着下移。
    out.bsHint = {};
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });
    E.newGame();
    var sh = E.state();
    sh.flags.hasBlock = true;
    sh.floor = 4;                       // 第 5 层起三把打法同屏（架盾第 4 层、缠斗第 5 层）
    sh.atk = 40; sh.def = 20; sh.hp = 1500; sh.maxHp = 1500;
    var bp = null;
    for (var by = 1; by < 10 && !bp; by++) {
      for (var bx = 1; bx < 10 && !bp; bx++) {
        var chB = sh.maps[4][by][bx];
        var moB = w.GAME_DATA.monsters[chB];
        if (!moB || moB.ghost || moB.boss) continue;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (o) {
          if (bp) return;
          var ax3 = bx + o[0], ay3 = by + o[1];
          if (ax3 < 1 || ax3 > 9 || ay3 < 1 || ay3 > 9) return;
          if (sh.maps[4][ay3][ax3] !== '.') return;
          bp = { x: bx, y: by, hx: ax3, hy: ay3 };
        });
      }
    }
    if (bp) {
      sh.x = bp.hx; sh.y = bp.hy;
      w.__tm.refreshHud();
      await new Promise(function (r) { setTimeout(r, 60); });
      w.__tm.clickMove(bp.x, bp.y);
      var tB = Date.now(), upB = false;
      while (Date.now() - tB < 2500) {
        if (d.getElementById('battleScene').classList.contains('show')) { upB = true; break; }
        await new Promise(function (r) { setTimeout(r, 40); });
      }
      out.bsHint.panelUp = upB;
      var hEl = d.getElementById('bsHint');
      out.bsHint.before = hEl ? hEl.textContent.trim() : '';
      var blkB = d.getElementById('bsBlock'), gdB = d.getElementById('bsGuard'), tgB = d.getElementById('bsTangle');
      out.bsHint.threeButtons = !!(blkB && !blkB.hidden) && !!(gdB && !gdB.hidden) && !!(tgB && !tgB.hidden);
      if (blkB && !blkB.hidden && !blkB.disabled) blkB.click();
      await new Promise(function (r) { setTimeout(r, 120); });
      out.bsHint.after = hEl ? hEl.textContent.trim() : '';
      out.bsHint.liveAfter = [blkB, gdB, tgB].filter(function (b) { return b && !b.hidden && !b.disabled; }).length;
      d.getElementById('battleScene').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await new Promise(function (r) { setTimeout(r, 600); });
    }
    w.__battleSpeed = 1;
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });

    // 商店链：8 / 11 / 13 层的商人，单击一次就要「走到跟前 → 首会对白 → 商店面板」。
    // 第 3 层曾因「walk 教学对白打断寻路 + playStory 覆盖丢回调」卡死，这里把整条链钉进闸门。
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });
    out.shopChain = [];

          };
          clean();
          w.__tm.openVow(true);
          var r = {
            cards: d.querySelectorAll('#vowCards .vow-card').length,
            hint: (d.querySelector('#vowOverlay .vow-hint') || {}).textContent || '',
          };
          k('ArrowRight');
          r.focus0 = focusIdx();
          k('ArrowRight');
          r.focus1 = focusIdx();
          k('ArrowLeft'); k('ArrowLeft');
          r.wrap = focusIdx();
          r.focusNoDup = d.querySelectorAll('#vowCards .vow-card.focus').length;
          var want = d.querySelector('#vowCards .vow-card.focus').dataset.vow;
          k('Enter');
          var st = E.state();
          r.enterVow = (st && st.flags) ? st.flags.vow : null;
          r.enterWant = want;
          r.enterClosed = !d.getElementById('vowOverlay').classList.contains('show');
          clean();
          w.__tm.openVow(true);
          var want2 = d.querySelectorAll('#vowCards .vow-card')[1].dataset.vow;
          k('2');
          var st2 = E.state();
          r.digitVow = (st2 && st2.flags) ? st2.flags.vow : null;
          r.digitWant = want2;
          clean();
          // 浮层挡走人：三种浮层各开一次，连按两次方向键，坐标一格都不许动
          E.newGame(null, { seed: 0 });
          var pos = function () { var s = E.state(); return s ? s.x + ',' + s.y : '?'; };
          var stay = function (open, close) {
            var p0 = pos();
            open();
            k('ArrowRight'); k('ArrowRight');
            var p1 = pos();
            close();
            return p0 === p1;
          };
          r.stayHintBook = stay(function () { w.__tm.openHintBook(); }, function () { d.getElementById('hintBookOverlay').classList.remove('show'); });
          r.stayReset = stay(function () { d.getElementById('resetConfirmOverlay').classList.add('show'); }, function () { d.getElementById('resetConfirmOverlay').classList.remove('show'); });
          r.stayCollection = stay(function () { w.__tm.openCollection(); }, function () { w.__tm.closeCollection(); });
          // Esc 覆盖面（必须选择的路遇 / 祭坛 / 锁芯门不算「可取消」，故意不响应）
          var esc = function (open, id) {
            open();
            var before = d.getElementById(id).classList.contains('show');
            k('Escape');
            var after = d.getElementById(id).classList.contains('show');
            if (after) d.getElementById(id).classList.remove('show');
            return before && !after;
          };
          clean();
          r.escHintBook = esc(function () { w.__tm.openHintBook(); }, 'hintBookOverlay');
          r.escReset = esc(function () { d.getElementById('resetConfirmOverlay').classList.add('show'); }, 'resetConfirmOverlay');
          r.escBoard = esc(function () { w.__tm.openBoard(); }, 'boardOverlay');
          r.escCollection = esc(function () { w.__tm.openCollection(); }, 'collectionOverlay');
          // 输入框隔离：过滤框里按 d / ← 都不许被移动分支吃掉（defaultPrevented 是最硬的判据）
          clean();
          w.__tm.openHintBook();
          var fl = d.getElementById('hbFilter');
          var st3 = E.state();
          st3.x = 1; st3.y = 1;
          if (fl) fl.focus();
          var ed = new w.KeyboardEvent('keydown', { key: 'd', bubbles: true, cancelable: true });
          if (fl) fl.dispatchEvent(ed);
          r.fieldDPrevented = ed.defaultPrevented;
          st3.x = 1; st3.y = 1;
          var eL = new w.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true, cancelable: true });
          if (fl) fl.dispatchEvent(eL);
          r.fieldArrowPrevented = eL.defaultPrevented;
          d.getElementById('hintBookOverlay').classList.remove('show');
          return r;
        })();
        // 渲染异常探针：整轮 UI 自检跑下来一次都不许有
        out.renderErrors = (w.__tmRenderErrors || []).length;
        out.renderErrorSample = (w.__tmRenderErrors || []).slice(0, 2);
        // 激励视频接口位（IAA 红线）：默认恒不可用 → 死亡页不出现广告按钮；
        // 接口契约在两种状态下都要稳（不可用时立刻回调 false，绝不挂起）
        out.adDefaultOff = !!(w.Ads && w.Ads.available() === false);
        out.adSlots = w.Ads ? w.Ads.slots() : [];
        var adCb = [];
        w.Ads.show('revive', function (ok) { adCb.push(ok); });
        out.adImmediateFalse = adCb.length === 1 && adCb[0] === false;
        var badSlot = null;
        w.Ads.show('nope', function (ok) { badSlot = ok; });
        out.adBadSlot = badSlot === false;
        // 调试入口总门（js/devgate.js）：`?ads=1` / `#demo=` / `?dev=1` 只认本地预览。
        // 这里喂假域名验门本身——浏览器里改不了 location.hostname，纯函数是唯一可测点。
        var G = w.DevGate;
        out.devGateLoaded = !!(G && typeof G.local === 'function' && typeof G.allow === 'function');
        if (out.devGateLoaded) {
          out.devGateLocal = G.local('localhost', 'http:') === true
            && G.local('127.0.0.1', 'http:') === true
            && G.local('', 'file:') === true;
          out.devGateProd = G.local('towermates.app.workbuddy.host', 'https:') === false
            && G.local('localhost.evil.com', 'https:') === false
            && G.local('127.0.0.1.nip.io', 'http:') === false;
          out.devGateHere = G.local() === true; // 本机探针确实跑在本地
        }
        d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });
        E.newGame();
        var s9 = E.state();
        s9.floor = 2; s9.hp = 0; s9.over = true;
        w.__tm.resetDeath();
        w.__tm.showDeath({ name: '墨妖' }, 500);
        out.adNoBtn = !d.getElementById('btnAdRevive');
        // 桩模式：按钮显形 → 点击 → 视频回调 → 原地复活（over 复位、血回到四成）
        w.Ads.debug();
        w.__tm.resetDeath();
        w.__tm.showDeath({ name: '墨妖' }, 500);
        var adBtn = d.getElementById('btnAdRevive');
        out.adBtnShown = !!adBtn;
        if (adBtn) adBtn.click();
        out.adBtnPending = adBtn ? adBtn.disabled : false;
        setTimeout(function () {
          out.adRevived = s9.over === false && s9.hp > 0;
          out.adRevivedHp = Math.round(s9.hp);
          out.adReviveFlag = s9.flags.adRevived === 1;
          document.getElementById('out').textContent = JSON.stringify(out);
        }, 400);
        document.getElementById('out').textContent = JSON.stringify(out);
      }, 1000);
    }, 600);

    // 余烬经济四项放在最后一段定时回调里跑，避免 showEnd 干扰提示系统的对白时序
  } catch (e) { out.error = String(e && e.stack || e); }
  document.getElementById('out').textContent = JSON.stringify(out);
}
</script>
</body>
