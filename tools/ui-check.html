<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>TowerMates UI check</title>
<script>
// 自动化场景不触发新手提示，保持被测画面干净
try { localStorage.setItem('towermates_tips_v2', JSON.stringify({
  walk:1, fight:1, block:1, blocksave:1, low:1, relic:1, goal:1, echo:1, ring:1, tooStrong:1, opening:1
})); } catch (e) {}
</script>
</head>
<body>
<iframe id="f" src="../index.html?play=1" style="width:430px;height:900px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
// iframe 被缓存时 load 可能早于本脚本执行：补一次就绪兜底，避免 run 永不触发。
// 环境慢或多会话并发时 boot 会超过固定延迟 → 改为轮询 Engine.state()，最多等 12s；
// 真起不来（脚本报错）也照样交给 run，让 out.booted=false 如实暴露问题。
(function () {
  var fr = document.getElementById('f'), kicked = false;
  function ready() {
    try { return !!(fr.contentWindow && fr.contentWindow.Engine && fr.contentWindow.Engine.state()); }
    catch (e) { return false; }
  }
  function kick() {
    if (kicked) return;
    kicked = true;
    var t0 = Date.now();
    (function poll() {
      if (ready() || Date.now() - t0 > 12000) { setTimeout(run, 80); return; }
      setTimeout(poll, 50);
    })();
  }
  fr.addEventListener('load', kick);
  if (fr.contentDocument && fr.contentDocument.readyState === 'complete') kick();
})();
async function run() {
  var out = {};
  try {
    var f = document.getElementById('f');
    var w = f.contentWindow, d = f.contentDocument;
    var E = w.Engine, s = E.state();
    out.booted = !!s;
    out.modules = { touch: !!w.TouchGestures, challenge: !!w.Challenge, wx: !!w.WXBridge };
    w.localStorage.removeItem('towermates_board');
    w.localStorage.removeItem('towermates_rivals');

    // 一次性往前开一层：拿钥匙、停在首层、最高层为 0
    s.flags['relic_gate'] = true;
    s.flags.maxFloor = 0;
    out.gateForthRaw = E.gateForth();
    w.__tm.openGate();
    var btn = d.getElementById('gateForthBtn');
    var tip = d.getElementById('gateForthTip');
    out.gateBtn = btn ? btn.textContent : null;
    out.gateTip = tip ? tip.textContent : null;
    out.gateEnabled = btn ? !btn.disabled : false;
    if (btn && !btn.disabled) { btn.click(); btn.click(); }
    var s2 = E.state();
    out.afterFloor = s2.floor;
    out.gateForthUsed = s2.flags.gateForth === true;
    out.sealCount = ((s2.flags || {}).gateSeals || []).length;

    // 挑战码：生产环境里的编解码与贴码进榜闭环
    var code = w.Challenge.encode({ ending: 'plain', vow: 'mercy', floor: 9, level: 12, steps: 500, time: 400, seal: 'ward', goals: 3 });
    out.codeLen = code.length;
    var dec = w.Challenge.decode(code);
    out.codeFloor = dec ? dec.floor : 0;
    out.codeSeal = dec ? dec.seal : '';
    out.codeGoals = dec ? dec.goals : 0;
    out.noScore = !!(dec && dec.score === undefined);
    var input = d.getElementById('pasteCode');
    out.pasteMax = input ? Number(input.maxLength) : 0;
    if (input) {
      input.value = code;
      d.getElementById('btnPasteCode').click();
      var rival = d.querySelector('#boardList .bd-row.rival');
      out.rivalRow = rival ? rival.textContent.replace(/\s+/g, ' ').trim().slice(0, 80) : null;
      // 幽灵行只要进榜即可（文案随版本演进：名字列显示楼层，分数在行尾）
      out.rivalScore = !!(rival && rival.textContent.indexOf('挑战·朋友') >= 0);
      out.rivalFloor = !!(rival && /9\s*层/.test(rival.textContent));
    }

    // 点一次远处的怪物：应自动走到跟前并直接开打，不需要第二次点击
    E.newGame();
    var s3 = E.state();
    var target = null;
    for (var yy = 0; yy < 11 && !target; yy++) {
      for (var xx = 0; xx < 11 && !target; xx++) {
        var ch3 = E.tile(xx, yy);
        var mo = w.GAME_DATA.monsters[ch3];
        if (!mo || mo.ghost || mo.boss) continue;
        if (Math.abs(xx - s3.x) + Math.abs(yy - s3.y) < 2) continue;
        var reachable = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(function (o) {
          var pp = E.pathTo(xx + o[0], yy + o[1]);
          return !!(pp && pp.length);
        });
        if (reachable) target = { x: xx, y: yy, ch: ch3 };
      }
    }
    out.clickTarget = target ? target.x + ',' + target.y : null;
    if (target) {
      s3.atk = 999; s3.def = 999; s3.hp = 99999; s3.maxHp = 99999;
      // blocksave 教学是一次性对白（Tips 存 localStorage），测试里预标记已读
      try { var tk = Object.keys(W.localStorage).filter(function(k){return /tip/i.test(k);}); tk.forEach(function(k){ var o=JSON.parse(W.localStorage.getItem(k)||'{}'); o.blocksave=1; W.localStorage.setItem(k, JSON.stringify(o)); }); } catch(e){}
      out.clickDist = Math.abs(target.x - s3.x) + Math.abs(target.y - s3.y);
      var kills0 = s3.flags.killCount || 0;
      w.__tm.clickMove(target.x, target.y);
      await new Promise(function (r) { setTimeout(r, 3200); });
      var s4 = E.state();
      out.clickKills = (s4.flags.killCount || 0) - kills0;
      out.clickCleared = E.tile(target.x, target.y) !== target.ch;
      out.clickOnTile = s4.x === target.x && s4.y === target.y;
    }

    // 第 3 层关键通道：商店不再焊在「打砚 → 上楼」的唯一立足格上
    E.newGame();
    var s5 = E.state();
    s5.floor = 2; s5.x = 5; s5.y = 9;
    out.f3Ledge = E.tile(5, 6);
    var p5 = E.pathTo(5, 6);
    out.f3ReachLedge = !!(p5 && p5.length);
    var qx = 5, qy = 9, hitShop = false;
    (p5 || []).forEach(function (o) {
      qx += o[0]; qy += o[1];
      if (E.tile(qx, qy) === 'M') hitShop = true;
    });
    out.f3ShopOnPath = hitShop;
    out.f3UpPath = !!E.pathThrough(1, 1);

    // 提示系统自检：加粗渲染、角色台词、挂够时间自己收起
    var probe = d.createElement('div');
    w.__tm.richInto(probe, '先看**加粗**再走 <b>不是标签</b>');
    out.richBold = probe.querySelectorAll('strong').length === 1
      && probe.textContent === '先看加粗再走 <b>不是标签</b>';
    out.richNoHtml = probe.querySelectorAll('b').length === 0;
    out.hintScripts = !!w.STORY.hints && Object.keys(w.STORY.hints).length >= 9
      && w.STORY.hints.block[0][1].indexOf('**') >= 0;
    w.__tm.warn('测试**加粗**');
    out.warnBold = d.getElementById('warnPill').querySelectorAll('strong').length === 1;
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });
    // 开局引导已预标记已读；先点掉残留对白，再单独测提示系统
    d.getElementById('dlgSkip').click();
    w.__tm.say([['烛', '这条**测试提示**不会一闪而过', 'calm']], { autoMs: 5000 });
    setTimeout(function () {
      var dl = d.getElementById('dialogOverlay');
      out.hintDialog = dl.classList.contains('show') && dl.classList.contains('hint-mode')
        && d.getElementById('dlgText').querySelectorAll('strong').length >= 1
        && d.getElementById('dlgCue').textContent.indexOf('点击收起') >= 0;
      document.getElementById('out').textContent = JSON.stringify(out);
      // 用短时长验证提示自动收起，不用真等 7 秒
      d.getElementById('dlgSkip').click();
      w.__tm.say([['烛', '**自动收起**测试', 'calm']], { autoMs: 300 });
      setTimeout(function () {
        out.hintAutoClose = !dl.classList.contains('show');
        // 卡关指引 / 提示停留档位 / 重看提示
        var sb = d.getElementById('stuckBar');
        w.__tm.showStuck({ name: '砚', def: 16 }, { reason: '攻击力不足，无法破防', damage: null }, E.state());
        out.stuckBar = !sb.hidden && sb.querySelectorAll('strong').length >= 2
          && d.getElementById('stuckText').textContent.indexOf('攻击还差') >= 0;
        w.__tm.clearStuck();
        var sp0 = w.__tm.Settings.hintSpeed;
        var sp1 = w.__tm.Settings.cycleHintSpeed();
        out.hintSpeed = sp1 !== sp0 && w.__tmCfg.hintSpeed === sp1;
        out.hintMsScaled = sp1 === 'normal' ? w.__tm.hintMs(7000) === 7000 : w.__tm.hintMs(7000) !== 7000;
        w.__tm.openHintBook();
        out.hintBook = d.getElementById('hintBookOverlay').classList.contains('show')
          && d.querySelectorAll('#hbList .hb-item').length >= 10;
        d.getElementById('hintBookOverlay').classList.remove('show');
        // 余烬经济四项：明细 / 近 3 局平均 / 解锁誓约首通 / 全解锁后的层灯出口
        var M = w.__tm.Meta;
        M.add(200);
        M.buy('ascetic', 24);
        M.buy('nameless', 48);
        M.memory.lamps = 0;
        M.memory.firstVowWin = {};
        var eA = w.__tm.emberOf(E.state(), 0, w.GAME_DATA.vows.ascetic);
        M.claimFirstWin('ascetic');
        var eB = w.__tm.emberOf(E.state(), 0, w.GAME_DATA.vows.ascetic);
        out.firstWinBonus = eA.total - eB.total;
        M.memory.emberRuns = [10, 20, 30];
        out.avgEmber = M.avgEmber();
        M.memory.emberRuns = [];
        out.avgFallback = M.avgEmber();
        E.newGame();
        var s7 = E.state();
        s7.ending = 'true'; s7.won = true; s7.startedAt = Date.now() - 360000;
        s7.flags.vow = 'none';
        w.__tm.showEnd();
        var ed7 = d.getElementById('endEmberDetail');
        out.emberDetail = !!ed7 && ed7.textContent.indexOf('走到结局') >= 0 && ed7.textContent.indexOf('合计') >= 0;
        out.lampBtn = !!d.querySelector('#endMemory .lamp-btn');
        var emberBefore = M.ember, lampsBefore = M.lamps;
        var lb7 = d.querySelector('#endMemory .lamp-btn');
        if (lb7 && !lb7.disabled) lb7.click();
        out.lampLit = M.lamps === lampsBefore + 1 && M.ember === emberBefore - 20;
        document.getElementById('out').textContent = JSON.stringify(out);
      }, 1000);
    }, 600);

    // 余烬经济四项放在最后一段定时回调里跑，避免 showEnd 干扰提示系统的对白时序
  } catch (e) { out.error = String(e && e.stack || e); }
  document.getElementById('out').textContent = JSON.stringify(out);
}
</script>
</body>
</html>
