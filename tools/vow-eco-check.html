<!DOCTYPE html><body>
<iframe id="f" src="/index.html" style="width:430px;height:900px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
const w2 = (ms) => new Promise(r => setTimeout(r, ms));
f.addEventListener('load', async () => {
  const d = f.contentDocument, W = f.contentWindow;
  try {
    for (let i = 0; i < 20 && !W.__tm; i++) await w2(200);
    W.localStorage.setItem('towermates_meta', JSON.stringify({ ember: 8, unlocked: [], resets: 0, memory: {} }));
    f.src = '/index.html?v=2';
    await w2(800);
    d.getElementById('btnNew').click();
    await w2(500);
    const out = { cards: [] };
    d.querySelectorAll('.vow-card').forEach(function (c) {
      out.cards.push({
        name: c.querySelector('.vc-name').textContent,
        tier: (c.querySelector('.vc-tier')||{}).textContent || 'none',
        reward: (c.querySelector('.vc-mul')||{}).textContent || '',
      });
    });
    const chip = d.querySelector('.vow-chip');
    out.lockChip = chip ? chip.textContent : 'none';
    document.getElementById('out').textContent = JSON.stringify(out);
  } catch (e) { document.getElementById('out').textContent = 'ERR ' + e.message; }
});
</script></body>
