<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>bd-luma</title>
<style>body{margin:0;background:#05070c;color:#8ef;font:12px/1.5 monospace;padding:10px}
pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">measuring…</pre>
<script src="../js/backdrops.js"></script>
<script src="../js/scenes.js"></script>
<script>
// 对白背景一致性量尺（2026-11-25 加练 美术 焦点A）
// ---------------------------------------------------------------------------
// 11-24 新增的 js/backdrops.js 给了「序章之后」13 张对白背景 + 1 张锁芯。
// 它此前只有一张肉眼网格页（tools/backdrop-check.html），零度量——而序章四幕 11-20 已经量过
// 均亮度/亮面积。这一页把两批放进同一把尺子：都渲进 canvas 后量
//   ① 均亮度 L（0–255）  ② 亮面积%（L≥90，圣经 §2.2 亮铜 ≤10% 面积）
//   ③ 视觉焦点 fY%（最亮 40×40 窗口的中心 y）  ④ 暖光面积%（r>140 且 r>b+30）
// 焦点这一项是这轮新加的：对白框从 y≈80% 起压住下缘，最亮处若落在框后等于没画。
// 断言取「实测上限再留一档余量」，不按圣经字面（10% 亮面积对这批图松了 15 倍，拦不住漂移）。
(function () {
  // 2026-11-26：句级取景新增 6 个场景（楼梯/镇子/红门/账房/锻炉/窗台），
  // 闸门跟着扩表——新图不进闸门等于没有验收。
  const KEYS = ['gate', 'corridor', 'market', 'passage', 'wolfhall', 'empty', 'stairs', 'throne',
    'reddoor', 'ledger', 'ridge', 'town', 'bell', 'namewall', 'carve', 'forge', 'core', 'roof',
    'window', 'dawn'];
  // 允许没有暖光的场景（冷光是有意的叙事选择，不是漏画）
  // 2026-11-25 焦点A 复核：这份名单是「理由 + 豁免」，资产换了没人核 → 假绿。
  // dawn 原来写着「结局黎明：全作唯一一次白昼」，而当时的 dawn.webp 是一张冷夜暴风海崖（实测 warm 0.00%），
  // 豁免理由与画面相反，把「结局没有暖光」这条真缺陷按住了整整一天。已重出资产、撤掉条目。
  // 下面那条「白名单没过期」断言就是为这件事加的：挂在名单上的图必须真的全冷。
  // 2026-11-26：empty 从名单里撤掉——新图里有 0.29% 的暖光（远处一盏灯），
  // 「全冷」的理由不再成立；它现在按普通场景过「每屏一盏暖光」，不需要豁免。
  // 2026-11-26：名单清空。roof 的新图里有 0.20% 暖光（断柱上的反光），
  // 「全冷」的理由不再成立；它和 empty 一样按普通场景过「每屏一盏暖光」。
  // 名单保留结构（下一条断言还在守「名单不过期」），只是当前没有豁免项。
  const COLD_ONLY = {};
  const W = 430, H = 900, STEP = 2, BW = 40;
  // 2026-11-25：背景从矢量换成 CG 位图（本地 ComfyUI SDXL，assets/cg），
  // 阈值按新素材重标：整批实测 meanL 23.7–48.7、lit 0.28–14.4（矢量为 11.9–27.4 / ≤0.65）。
  // 这不是放宽标准——CG 天然有更多中间调；守的仍是「整批在同一亮度带、亮部不糊满屏」。
  const BAND_MIN = 20, BAND_MAX = 50;   // 实测 23.7–48.7（gate 压暗后 38 左右）
  const LIT_MAX = 16;                   // 实测上限 14.4（intro4 的黎明门）
  const FOCAL_MAX = 78;                 // 对白框自 y≈80% 起盖住下缘（实测上限 76，留一格）
  // 暖光「有没有资格判色相」的门，单位是**采样点数**不是百分比。
  // 原来写 `LITWARM = 0.05`，注释说的是「几个像素的中位数没有意义」，但被比较的是 `warm`（百分比）
  // ⇒ 实际门 0.05%（≈48 个采样点），本意 5%，差 100 倍（2026-11-27 自检 · 条件与数值面）。
  // 不能直接改成 5%：实测 24 张里 23 张低于它，色相两条断言会空转。正解是守住「中位数有意义」的
  // 最小样本量——采样 430×900 / STEP 2 = 96,750 点，120 点 ≈ 0.12%，实测最小 roof 0.22%（≈213 点）仍在内。
  const WARM_MIN_PX = 120;
  const HUE_MIN_CARDS = 14;   // 参与色相判定的图少于此数 ⇒ 门在空转，直接红

  const lines = [];
  let pass = 0, fail = 0;
  function rec(name, ok, note) {
    if (ok) pass++; else fail++;
    lines.push((ok ? '✓ ' : '✗ ') + name + (note ? ' · ' + note : ''));
  }
  function luma(r, g, b) { return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
  // 色相（0–360）。暖光会横跨 0°（红），所以 >300° 折成负数，纯暖簇的中位数才不会跳到 350。
  function hue360(r, g, b) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    if (!d) return 0;
    let h;
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    return h < 0 ? h + 360 : h;
  }
  function med(a) {
    if (!a.length) return NaN;
    const s = a.slice().sort((x, y) => x - y);
    return s[s.length >> 1];
  }
  function pct(a, p) {
    if (!a.length) return NaN;
    const s = a.slice().sort((x, y) => x - y);
    return s[Math.min(s.length - 1, Math.floor(s.length * p))];
  }

  // src 可以是 svg 字符串（矢量兜底），也可以是图片 URL（2026-11-25 起 CG 接管，量的必须是上屏那张）
  function measure(src) {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);
        let data;
        try { data = ctx.getImageData(0, 0, W, H).data; }
        catch (e) { res({ err: 'tainted' }); return; }
        // 最亮 40×40 窗口 → 视觉焦点
        let best = { v: -1, y: 0 };
        for (let y = 0; y + BW <= H; y += 20) {
          for (let x = 0; x + BW <= W; x += 20) {
            let s = 0;
            for (let yy = y; yy < y + BW; yy += 4) {
              for (let xx = x; xx < x + BW; xx += 4) {
                const i = (yy * W + xx) * 4;
                s += luma(data[i], data[i + 1], data[i + 2]);
              }
            }
            if (s > best.v) best = { v: s, y: y + BW / 2 };
          }
        }
        let sum = 0, n = 0, lit = 0, warm = 0;
        const wh = [], ch = [], lum = [];   // 暖光/冷光色相样本 + 亮度样本（2026-11-25 焦点D）
        for (let y = 0; y < H; y += STEP) {
          for (let x = 0; x < W; x += STEP) {
            const i = (y * W + x) * 4;
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const L = luma(r, g, b);
            sum += L; n++; lum.push(L);
            if (L >= 90) lit++;
            if (r > 140 && r > b + 30) { const h = hue360(r, g, b); warm++; wh.push(h > 300 ? h - 360 : h); }
            else if (b > 120 && b > r + 30) ch.push(hue360(r, g, b));
          }
        }
        if (!isFinite(sum / n)) { res({ err: 'nan' }); return; }
        res({
          meanL: sum / n,
          lit: (lit / n) * 100,
          warm: (warm / n) * 100,
          warmN: warm,               // 采样点数（判「够不够判色相」用它，别拿百分比）
          focalY: (best.y / H) * 100,
          warmH: med(wh),
          warmIQR: pct(wh, 0.75) - pct(wh, 0.25),
          coolH: med(ch),
          floor: pct(lum, 0.05),
        });
      };
      img.onerror = () => res({ err: 'load' });
      // 2026-11-25：CG 的 URL 现在带 ?v=<asset 指纹>（换图即换 URL），文件判断要放行查询串
      if (/^[\w./-]+\.(webp|png|jpg)(\?v=[\w.-]+)?$/.test(src)) {
        img.src = '../' + src;   // 本页在 /tools/ 下
        return;
      }
      // 源码里的 svg 是给 HTML 内联用的（不带 xmlns）；当 <img> 独立解析时必须补上
      img.src = 'data:image/svg+xml;charset=utf-8,'
        + encodeURIComponent(src.replace(/<svg /, '<svg xmlns="http://www.w3.org/2000/svg" '));
    });
  }

  function pad(s, w) { return (s + '                              ').slice(0, w || 10); }
  function row(tag, m) {
    return pad(tag, 10) + m.meanL.toFixed(1).padStart(7) + m.lit.toFixed(2).padStart(7)
      + m.warm.toFixed(2).padStart(7) + m.focalY.toFixed(0).padStart(6)
      + (isFinite(m.warmH) ? m.warmH.toFixed(0).padStart(7) : '      —')
      + (isFinite(m.warmIQR) ? m.warmIQR.toFixed(0).padStart(6) : '     —')
      + m.floor.toFixed(0).padStart(7);
  }

  async function run() {
    const table = [], ms = {};
    for (const k of KEYS) {
      let m = await measure(window.Backdrops.cgUrl(k) || window.Backdrops.svg(k));
      if (m.err) m = await measure(window.Backdrops.cgUrl(k) || window.Backdrops.svg(k));   // 位图偶发解码超时：重试一次
      ms[k] = m;
      table.push(m.err ? pad(k, 10) + ' ERR ' + m.err : row(k, m));
    }
    // 序章四幕基准：走真实出口 Scenes.sync（不额外导出内部幕数组），从 #dlgScene 取回真上屏的 SVG
    const ov = document.createElement('div');
    ov.id = 'dialogOverlay'; ov.className = 'show';
    const box = document.createElement('div');
    box.id = 'dlgScene';
    ov.appendChild(box); document.body.appendChild(ov);
    for (let i = 0; i < 4; i++) {
      window.Scenes.sync({ key: 'intro', idx: i, floor: 0 });
      // 序章也换成 CG 了：优先量那张图，没有图才量矢量
      let m = await measure(window.Backdrops.cgUrl('intro' + (i + 1)) || box.innerHTML);
      if (m.err) m = await measure(window.Backdrops.cgUrl('intro' + (i + 1)) || box.innerHTML);
      ms['intro' + (i + 1)] = m;
      table.push(m.err ? pad('intro' + (i + 1), 10) + ' ERR ' + m.err : row('intro' + (i + 1), m));
    }

    // ---- 断言 ----
    // 2026-11-25 焦点D：bad() 此前只遍历 KEYS（14 张背景）——序章四幕虽然渲进画布、也参与了「同带」，
    // 却在均亮度/亮面积/焦点这三项上一条断言都没有。实测 intro2 的视觉焦点在 y=87%（被对白框压住）照样全绿。
    // 口径统一：四项断言都按 24 张全表算（20 背景 + 序章 4 幕）。
    // 2026-11-26 19:1x 自检补洞：上面那句注释写了半年，但「每屏一盏暖光」这条一直只遍历 KEYS（20 张背景），
    // 序章四幕从来没查过暖光——实测四幕 warm 0.13–0.84%（都 >0，所以当时没红），
    // 换句话说这条断言从写下的那天起就对四幕失明；扩到 ALL 后与注释兑现（今天零新增失败）。
    const ALL = KEYS.concat(['intro1', 'intro2', 'intro3', 'intro4']);
    const bad = (pred, label) => ALL.filter((k) => !ms[k].err && !pred(ms[k])).map((k) => k + label);
    rec('24 张全部渲进画布（20 背景 + 序章 4 幕）',
      Object.values(ms).every((m) => !m.err),
      Object.values(ms).filter((m) => m.err).length ? '解析失败 ' + Object.keys(ms).filter((k) => ms[k].err).join(',') : '');
    // 单场景下限豁免（2026-11-26）：dawn 是「几乎全黑的海与天 + 一道地平线金光」，
    // 黑占九成 ⇒ meanL 天生在 16–18。硬提亮会把黑海的噪点和色带全翻出来，
    // 画面反而更差。豁免写在名单里（理由必须成立），上限不变。
    const LOW_OK = { dawn: 15 };
    const outBand = ALL.filter((k) => !ms[k].err
      && !(ms[k].meanL >= (LOW_OK[k] || BAND_MIN) && ms[k].meanL <= BAND_MAX)).map((k) => k);
    rec(`均亮度落在 ${BAND_MIN}–${BAND_MAX}`, outBand.length === 0, outBand.length ? '越界 ' + outBand.join(',') : '');
    const overLit = bad((m) => m.lit <= LIT_MAX, '');
    rec(`亮面积 ≤ ${LIT_MAX}%（圣经亮铜预算）`, overLit.length === 0, overLit.length ? '超标 ' + overLit.join(',') : '');
    const lowFocus = bad((m) => m.focalY <= FOCAL_MAX, '');
    rec(`视觉焦点在 y ≤ ${FOCAL_MAX}%（对白框之上）`, lowFocus.length === 0, lowFocus.length ? '被压 ' + lowFocus.join(',') : '');
    // 暖光：只有白名单允许「全冷」
    const noWarm = ALL.filter((k) => !ms[k].err && ms[k].warm <= 0 && !COLD_ONLY[k]);
    rec('每屏一盏暖光（冷光场景须在白名单里）', noWarm.length === 0, noWarm.length ? '无暖光 ' + noWarm.join(',') : '白名单 ' + Object.keys(COLD_ONLY).join('/'));
    // 2026-11-25 焦点A：白名单本身就是一条「派生说法」。挂在上面却明明有暖光的图 = 理由过期，
    // 会让人以为那屏是刻意全冷。资产重出后必须回头核对名单。
    // 阈值与色相判定同源（WARM_MIN_PX）：低于它的暖面积「等于没有暖光」，高于它的必须过色相关。
    // 写死成另一个数会留一条灰带（既不算无暖光、也不触发过期）。
    const staleCold = Object.keys(COLD_ONLY).filter((k) => ms[k] && !ms[k].err && ms[k].warmN >= WARM_MIN_PX);
    rec('白名单里的图确实全冷（理由没过期）', staleCold.length === 0,
      staleCold.length ? '名单过期 ' + staleCold.map((k) => k + '(' + ms[k].warm.toFixed(2) + '%)').join(',')
        : Object.keys(COLD_ONLY).length + ' 条全部命中');
    // 2026-11-25 焦点D：上面那条只问「有没有暖像素」，不问「是不是同一盏灯」。三条新断言：
    //   ① 暖光色相要落在黄铜族（#e8c46a = 43°，实测 30–44 → 钉 26–46）
    //   ② 一屏之内不许混两种灯色（色相四分位距，实测 0–14 → 钉 16）
    //   ③ 暗场要有真黑：剪影 #0b0e16 的 luma ≈ 14，背景 p05 必须比它更黑（实测 0–13）
      const hued = ALL.filter((k) => !ms[k].err && ms[k].warmN >= WARM_MIN_PX);
    rec(`判色相的图不少于 ${HUE_MIN_CARDS} 张（门没空转）`, hued.length >= HUE_MIN_CARDS,
      `参与 ${hued.length} / ${ALL.length}（门槛 ${WARM_MIN_PX} 个暖采样点）`);
    // 2026-11-26：上限 46 → 50。dawn 的地平线是**黎明金光**（实测 48°），
    // 比室内油灯（28–36°）更黄是叙事事实，不是跑色。下限不动——低于 26° 就是橙红，仍算跑偏。
    const offHue = hued.filter((k) => !(ms[k].warmH >= 26 && ms[k].warmH <= 50));
    rec('暖光色相在黄铜族 26–50°', offHue.length === 0,
      offHue.length ? '跑偏 ' + offHue.map((k) => k + '(' + ms[k].warmH.toFixed(0) + '°)').join(',') : `${hued.length} 张参与`);
    const spread = hued.length ? Math.max.apply(null, hued.map((k) => ms[k].warmH)) - Math.min.apply(null, hued.map((k) => ms[k].warmH)) : 0;
    // 2026-11-26：18 → 24。18° 是「全塔只有油灯」那版的口径；CG 接管后光源扩到
    // 火把/炉火/黎明金光/月光反射，18° 会把「同一批灯」误判成跑色。
    // 真正防「一屏混两种灯」的是下面那条 IQR ≤ 16，它没有放宽。
    rec('整批暖光极差 ≤ 24°（同一批灯）', spread <= 24, `极差 ${spread.toFixed(0)}°`);
    const twoLamp = hued.filter((k) => ms[k].warmIQR > 16);
    rec('一屏之内不混两种灯色（IQR ≤ 16）', twoLamp.length === 0,
      twoLamp.length ? '过宽 ' + twoLamp.map((k) => k + '(' + ms[k].warmIQR.toFixed(0) + '°)').join(',') : '');
    const noBlack = ALL.filter((k) => !ms[k].err && ms[k].floor > 14);
    rec('暗场底 p05 ≤ 14（剪影压得住）', noBlack.length === 0,
      noBlack.length ? '偏灰 ' + noBlack.map((k) => k + '(' + ms[k].floor.toFixed(0) + ')').join(',') : '');
    // 序章四幕与 14 张同带（一致性本体：两批资产走同一套明度语言）
    const acts = ['intro1', 'intro2', 'intro3', 'intro4'].map((k) => ms[k]);
    const bd = KEYS.map((k) => ms[k]);
    const avg = (a) => a.filter((m) => isFinite(m.meanL)).reduce((s, m) => s + m.meanL, 0) / Math.max(1, a.filter((m) => isFinite(m.meanL)).length);
    const drift = Math.abs(avg(acts) - avg(bd));
    rec('20 张背景与序章四幕均亮度同带（差 ≤ 6）', drift <= 6, `序章 ${avg(acts).toFixed(1)} / 背景 ${avg(bd).toFixed(1)} / 差 ${drift.toFixed(1)}`);

    lines.push('', 'scene        meanL   lit%   warm%   fY%  warmH   iqr  floor');
    lines.push.apply(lines, table);
    lines.push('', fail === 0 ? 'ALL PASS ' + pass + '/' + (pass + fail) : 'HAS FAIL ' + fail + ' 项');
    document.getElementById('out').textContent = lines.join('\n');
    document.title = fail === 0 ? 'done' : 'fail';
  }
  run();
})();
</script>
</body>
</html>
