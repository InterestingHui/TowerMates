<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>shot</title>
<style>body{margin:0;background:#05070c;overflow:hidden}#err{position:fixed;left:0;top:0;width:430px;color:#00ff88;font:16px/1.35 monospace;background:#000;padding:8px;z-index:99;white-space:pre-wrap}#err:empty{display:none}</style>
</head>
<body>
<iframe id="f" style="width:430px;height:900px;border:0;display:block"></iframe>
<script>if(location.search.indexOf("w=")>-1){var W=Number(new URLSearchParams(location.search).get("w"))||430;document.getElementById("f").style.width=W+"px";}</script>
<pre id="err"></pre>
<script>
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || 'start';
  const f = document.getElementById('f');
  const errBox = document.getElementById('err');
  const errs = [];
  const base = q.get('page') || '/index.html';
  const VOWPICK = q.get('vow') || 'none';
  // ?zoom=2：把游戏画布放大 N 倍再截（验证画布内细节用）
  const ZOOM = Number(q.get('zoom')) || 1;
  if (ZOOM !== 1) {
    const st2 = document.createElement('style');
    st2.textContent = '#f{transform-origin:top left;transform:scale(' + ZOOM + ')}body{width:' + (430 * ZOOM) + 'px;height:' + (900 * ZOOM) + 'px}';
    document.head.appendChild(st2);
  }
  const src = {
    floor5: base + '?dev=1#demo=4,2,8',
    battle: base + '?dev=1#demo=0,2,3',
    battletwice: base + '?dev=1#demo=0,2,3',
    battleblock: base + '?dev=1#demo=0,2,3',
    shop: base + '?dev=1#demo=2,4,3,424242',
    tower: base + '?dev=1#demo=5,5,7',
    core: base + '?dev=1#demo=12,5,8',
    stoneidle: base + '?dev=1#demo=12,5,8',
    adsdeath: base + '?ads=1&dev=1',
    adsend: base + '?ads=1&dev=1',
    // 第八勇者线全链路：开局落在第 5 层狼厅 (6,1)，右移一步踩断剑 (7,1)
    sword: base + '?dev=1#demo=4,6,1',
    // 第 2–3 层散落物换位后的样子：固定种子，截图可复现（换位只挪 p/$，骨架不变）
    floor2: base + '?dev=1#demo=1,3,1,424242',
    floor3: base + '?dev=1#demo=2,3,1,424242',
  }[scene] || base + '?dev=1';
  // 截图场景不触发新手提示对白，保持被测画面干净
  try {
    localStorage.setItem('towermates_tips_v2', JSON.stringify({
      walk: 1, fight: 1, block: 1, blocksave: 1, low: 1, relic: 1, goal: 1, echo: 1, ring: 1, tooStrong: 1, opening: 1
    }));
    // dpadopen 场景需要在 iframe 引擎启动前预置「展开方向键」设置（dpadclosed 用默认的收起态）
    if (scene === 'dpadopen') {
      const cfg0 = JSON.parse(localStorage.getItem('towermates_cfg_v2') || '{}');
      cfg0.dpad = true;
      localStorage.setItem('towermates_cfg_v2', JSON.stringify(cfg0));
    }
    // 今日一塔相关场景要「老玩家」态：首局（runs=0）入口是故意藏起来的，不预置就截不到
    if (scene.indexOf('daily') === 0) {
      localStorage.setItem('towermates_meta', JSON.stringify({
        ember: 12, unlocked: [], resets: 0,
        memory: { runs: 3, deepest: 9, endings: { plain: 2 }, vowWins: {}, fullChapters: 1, heartTaken: 1, heartLeft: 0 },
      }));
    }
  } catch (e) {}
  f.src = src;

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const Q2 = [];   // 场景内往 #err 追加输出（dump-dom 不展开 iframe 内 DOM），onload 尾部统一落盘
  const q2push = (t) => Q2.push(t);

  f.onload = async () => {
    const w = f.contentWindow, d = f.contentDocument;
    w.addEventListener('error', (e) => errs.push('JS: ' + e.message));
    w.addEventListener('unhandledrejection', (e) => errs.push('Promise: ' + (e.reason && e.reason.message)));
    try {
      await wait(500);
      try {
        const st = d.createElement('style');
        st.textContent = '*{animation:none!important;transition:none!important}';
        d.head.appendChild(st);
      } catch (e) {}
      await wait(120);
      const T = w.__tm;
      const E = w.Engine;
      if (scene === 'start' || scene === 'floor5' || scene === 'battle' || scene === 'battletwice' || scene === 'battleblock' || scene === 'shop' || scene === 'tower' || scene === 'core') {
        if (scene === 'battleblock') {
          await wait(200);
          // demo 开局不带格挡：先授予，截图才有盾按钮可点
          E.state().flags.hasBlock = true;
          w.__battleSpeed = 4;
          w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp' }));
          await wait(420);
          const bb = d.getElementById('bsBlock');
          if (bb) bb.click();
          await wait(300);
        }
        if (scene === 'battle') {
          await wait(200);
          w.__battleSpeed = 30;
          w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp' }));
          await wait(300);
        }
        if (scene === 'battletwice') {
          // 双挡之环：盾牌上的剩余次数与战斗面板的「本层剩 2 次」都得对得上
          await wait(200);
          const sB = E.state();
          sB.flags.hasBlock = true;
          sB.flags.rings = ['twice'];
          T.refreshHud();
          w.__battleSpeed = 30;
          w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp' }));
          await wait(300);
        }
        if (scene === 'shop') {
          await wait(200);
          E.state().gold = 260;
          T.openShop();
          await wait(400);
        }
        if (scene === 'tower') {
          T.showFloorCard(5);
          await wait(400);
        }
      } else if (scene === 'dialog') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        d.getElementById('dialogOverlay').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await wait(200);
        for (let i = 0; i < 5; i++) {
          d.getElementById('dialogOverlay').dispatchEvent(new MouseEvent('click', { bubbles: true }));
          await wait(80);
        }
        T.playStory('candle2');
        await wait(500);
      } else if (scene === 'boss') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        T.playStory('bossJu');
        await wait(500);
        for (let i = 0; i < 4; i++) {
          d.getElementById('dialogOverlay').dispatchEvent(new MouseEvent('click', { bubbles: true }));
          await wait(60);
        }
        await wait(200);
      } else if (scene === 'vera') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        T.playStory('princessTrue');
        await wait(400);
        for (let i = 0; i < 2; i++) {
          d.getElementById('dialogOverlay').dispatchEvent(new MouseEvent('click', { bubbles: true }));
          await wait(60);
        }
        await wait(300);
      } else if (scene === 'choice') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        T.showEndingChoice();
        T.setChoiceFocus('true');
        await wait(700);
      } else if (scene === 'end') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        const s = E.state();
        s.ending = 'true'; s.won = true; s.startedAt = Date.now() - 360000;
        s.flags.journal = true; s.flags.relic_ward = true; s.flags.relic_edge = true;
        // 盾谱集齐 → 签名彩蛋行（截图要覆盖「一笔写下来」的动效落点）
        s.flags.hasBlock = true; s.flags.hasBlock2 = true;
        T.showEnd();
        await wait(1600);
      } else if (scene === 'daily') {
        // 老玩家回来看开始页：今日一塔入口应带日期、只占一行、不与「继续/开新局」抢位置
        T.refreshStartBadges();
        await wait(250);
        const bdD = d.getElementById('btnDaily');
        q2push('dailyBtn=' + (bdD ? (bdD.textContent.trim() + '@' + (bdD.style.display || 'block')) : 'MISS'));
      } else if (scene === 'dailyboard') {
        // 「🗓 今日」档：只收今天那一座塔的结算，普通局的条目不许串进来
        const dKey = w.Daily.keyOf(Date.now());
        localStorage.setItem('towermates_board', JSON.stringify([
          { floor: 13, ending: 'true', vow: 'none', time: 660, steps: 620, seal: 'clear', goals: 4, margin: 'S', daily: dKey },
          { floor: 12, ending: 'true', vow: 'mercy', time: 500, steps: 600, seal: 'clear', goals: 4, margin: 'S', daily: '2026-01-01' },
          { floor: 7, ending: 'plain', vow: 'none', time: 800, steps: 900, seal: 'rough', goals: 1, margin: '' },
        ]));
        T.openBoard();
        await wait(350);
        const tabD = d.querySelector('#boardTabs .btab[data-f="daily"]');
        if (tabD) tabD.click();
        await wait(350);
        q2push('dailyRows=' + d.querySelectorAll('#boardList .bd-row').length
          + ' empty=' + (d.querySelector('#boardList .bd-empty') ? 1 : 0));
      } else if (scene === 'dailyend') {
        // 走「今日一塔」入口 → 结算面板必须标出这是哪天的塔，且日签进了榜单数据
        const dlD = d.getElementById('dialogOverlay');
        for (let i = 0; i < 6; i++) {
          if (!dlD.classList.contains('show')) break;
          dlD.dispatchEvent(new MouseEvent('click', { bubbles: true }));
          await wait(60);
        }
        d.getElementById('btnDaily').click();
        await wait(320);
        if (d.getElementById('resetConfirmOverlay').classList.contains('show')) {
          q2push('confirm=shown');
          d.getElementById('resetConfirm').click();
          await wait(320);
        }
        for (let i = 0; i < 6; i++) {
          if (!dlD.classList.contains('show')) break;
          dlD.dispatchEvent(new MouseEvent('click', { bubbles: true }));
          await wait(60);
        }
        const sd = E.state();
        q2push('dailyKey=' + ((sd.flags && sd.flags.daily) || 'NONE') + ' vow=' + sd.flags.vow);
        sd.ending = 'true'; sd.won = true; sd.startedAt = Date.now() - 600000;
        T.showEnd();
        await wait(1500);
        q2push('briefDaily=' + (d.getElementById('endBrief').textContent.indexOf('今日一塔') >= 0 ? 'in' : 'MISS'));
      } else if (scene === 'sword') {
        // 第八勇者线全链路验收：demo 直达第 5 层（不点 btnNew——demo 模式下它会弹立誓面板挡路）
        // → 踩断剑（小传+遗物+成就「接过断剑」）→ 传送塔顶踩公主（无手记 → 认剑变体）
        // → 真结局抉择 → 结算（纸条+断剑句+执剑者）
        q2push('sword-step0-loaded');   // 分支进入即写
        const dlW = d.getElementById('dialogOverlay');
        // demo 直达不播序章；点掉可能的开场教学
        for (let i = 0; i < 8; i++) { if (!dlW.classList.contains('show')) break; dlW.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(60); }
        await wait(200);
        const vowOv = d.getElementById('vowOverlay');
        if (vowOv.classList.contains('show')) {
          // demo 直达不该弹立誓面板；万一弹了，选「不立誓」走正常入口
          const vc0 = d.querySelector('#vowCards .vow-card[data-vow="none"]');
          if (vc0) { vc0.click(); await wait(300); }
        }
        const sw = E.state();
        q2push('at=' + (sw.floor + 1) + 'F(' + sw.x + ',' + sw.y + ')');
        // (6,1) 右移一步踩 (7,1) 的 S 断剑（'#u.G...S.X#' 第 7 位）
        T.act(1, 0);
        await wait(500);
        // 断剑小传先播 → 点完；随后烛的遗物提示再点完
        for (let i = 0; i < 12; i++) { if (!dlW.classList.contains('show')) break; dlW.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(60); }
        await wait(200);
        const sw2 = E.state();
        q2push('edge=' + !!sw2.flags.relic_edge + ' atk=' + sw2.atk + ' at=' + (sw2.floor + 1) + 'F(' + sw2.x + ',' + sw2.y + ')');
        q2push('achEdge=' + (w.Achievements && w.Achievements.isUnlocked('edge') ? 'in' : 'MISS'));
        // 传送塔顶（第 12 层 (5,3)，往上一步踩 (5,1) 的 T 公主——中间 (5,2) 是空地、(5,3) 是墙
        // 等等：row3='#....#....#' x=5 是墙！公主在 (5,1)，从 (5,3) 上不去。改放 (4,2)，act(1,0) 到 (5,2)，
        // 再 act(0,-1) 踩 (5,1)=T。一次到位：直接放 (5,2)，act(0,-1)。
        sw2.floor = 11; sw2.x = 5; sw2.y = 2;
        sw2.flags.relic_edge = true;
        T.refreshHud();
        await wait(150);
        T.act(0, -1);
        await wait(600);
        q2push('veraVariant=' + (dlW.classList.contains('show')
          ? (d.getElementById('dlgText').textContent.includes('追上来了') ? 'vera-open'
            : d.getElementById('dlgText').textContent.slice(0, 12)) : 'no-dialog'));
        // 认剑变体验证：第二句应含「半截剑」——推进到第二句再查
        await wait(120);
        dlW.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await wait(200);
        q2push('swordVariant=' + (d.getElementById('dlgText').textContent.includes('半截剑') ? 'in' : 'MISS'));
        // 无手记线：点完变体对白直接进平结局（choice 面板不该弹）
        const ch = d.getElementById('choiceOverlay');
        for (let i = 0; i < 30; i++) { if (!dlW.classList.contains('show')) break; dlW.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(60); }
        await wait(600);
        const epi = d.getElementById('endEpi').textContent;
        q2push('end=' + d.getElementById('endOverlay').classList.contains('show')
          + ' choiceClosed=' + !ch.classList.contains('show')
          + ' plainSwordLine=' + (epi.includes('灯座上多刻了一个「川」字') ? 'in' : 'MISS')
          + ' zealChip=' + (d.getElementById('endBrief').textContent.includes('替川走到了塔顶') ? 'in' : 'MISS')
          + ' achFinish=' + (w.Achievements && w.Achievements.isUnlocked('edge_finish') ? 'in' : 'MISS'));
      } else if (scene === 'death1') {
        // 首局死亡（runs=0）：验证「下一局可立誓」预告卡
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcD = d.querySelector('#vowCards .vow-card[data-vow="none"]');
        if (_vcD) _vcD.click();
        await wait(300);
        const dlD = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlD.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        T.Meta.memory.runs = 0;
        const sD = E.state();
        sD.over = true; sD.hp = 0; sD.floor = 2; sD.flags.killCount = 7;
        T.showDeath({ name: '墨妖' }, 620);
        await wait(500);
      } else if (scene === 'board') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        const s = E.state();
        try {
          localStorage.setItem('towermates_board', JSON.stringify([
            { ending: 'true', floor: 13, level: 19, steps: 520, time: 905, seal: 'clear', goals: 13, vow: 'greed' },
            { ending: 'plain', floor: 11, level: 16, steps: 610, time: 1100, seal: 'name', goals: 8, vow: 'guard' },
          ]));
        } catch (e) {}
        T.openBoard();
        await wait(400);
        // 脚注验证写进外层 #err（dump-dom 不展开 iframe 内部 DOM）
        q2push('rnoteChuan=' + (d.getElementById('boardList').textContent.includes('剑断在第五层') ? 'in' : 'MISS')
          + ' rnoteYan=' + (d.getElementById('boardList').textContent.includes('停在第 3 层') ? 'in' : 'MISS'));
      } else if (scene === 'codex') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        const s = E.state();
        s.flags.codex = true; s.floor = 4; s.atk = 30; s.def = 22;
        // 人物区：点亮六位，留两个未知做对比（截图要能看出「已相遇/未相遇」两态）
        ['烛', '薇拉', '秤', '炎魔', '墨妖', '魔王'].forEach((w) => T.Meta.metChar(w));
        T.openCodex();
        await wait(400);
      } else if (scene === 'codexzoom') {
        // 图鉴大图：320px 位图展示位（点人物卡触发）
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcz = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vcz) _vcz.click();
        await wait(260);
        const sZ = E.state();
        sZ.flags.codex = true;
        ['烛', '薇拉', '秤', '炎魔', '墨妖', '魔王'].forEach((x) => T.Meta.metChar(x));
        T.openCodex();
        await wait(300);
        const cz = d.querySelector('.cx-char[data-who="墨妖"]');
        if (cz) cz.click();
        await wait(700);
      } else if (scene === 'bossintro') {
        // Boss 出场卡样板：320px 位图 + 名字条；只截图，不接管流程
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcb = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vcb) _vcb.click();
        await wait(260);
        const dlB = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlB.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        T.showBossIntro({ boss: true, name: '墨妖', title: '第一位工匠 · 名册之锁', chapter: 1 }, 2, null, true);
        await wait(700);
      } else if (scene === 'cfg') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        T.openCfg();
        await wait(400);
      } else if (scene === 'bossphase') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vc) _vc.click();
        await wait(260);
        const dlC = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlC.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        const sC = E.state();
        sC.floor = 5; sC.x = 5; sC.y = 6; sC.hp = 3000; sC.maxHp = 3000; sC.atk = 60; sC.def = 40;
        sC.flags.boss = true;
        T.refreshHud();
        T.resolveBattle(0, -1);
        await wait(500);
      } else if (scene === 'gate') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcg = d.querySelector('#vowCards .vow-card[data-vow="none"]');
        if (_vcg) _vcg.click();
        await wait(260);
        const dlG2 = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlG2.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        const sG2 = E.state();
        sG2.flags.relic_gate = true;
        sG2.flags.maxFloor = 4;
        T.refreshHud();
        T.openGate();
        await wait(500);
      } else if (scene === 'vowbuy') {
        T.Meta.add(200);
        d.getElementById('btnNew').click();
        await wait(400);
        // 锁着的誓约现在是底部小 chip（不占卡片位），点它解锁后才变成卡
        const chipA = d.querySelector('#vowLocked .vow-chip[data-lock="ascetic"]');
        const before = d.querySelector('#vowCards .vow-card[data-vow="ascetic"]');
        if (chipA) chipA.click();
        await wait(400);
        const meta = JSON.parse(localStorage.getItem('towermates_meta') || '{}');
        const cardB = d.querySelector('#vowCards .vow-card[data-vow="ascetic"]');
        errBox.textContent = 'chipBefore=' + !!chipA + ' cardBefore=' + !!before
          + ' emberLeft=' + meta.ember + ' unlocked=' + (meta.unlocked || []).join('|')
          + ' cardAfter=' + !!cardB
          + ' vowOverlay=' + d.getElementById('vowOverlay').classList.contains('show')
          + ' err=' + (errs.length ? errs.join('|') : 'none');
        return;
      } else if (scene === 'eventdeep') {
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc3 = d.querySelector('#vowCards .vow-card[data-vow="none"]');
        if (_vc3) _vc3.click();
        await wait(260);
        const dlD = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlD.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        const sD = E.state();
        sD.floor = 4; sD.gold = 120;
        T.refreshHud();
        T.openEvent('broker');
        await wait(600);
      } else if (scene === 'event') {

        for (let i = 0; i < 8; i++) { dlP.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        const sP = E.state();
        sP.floor = 0;
        // 找到第 1 层的蝙蝠（A），在它位置弹速查卡
        let pxy = null;
        for (let y = 0; y < 11 && !pxy; y++) for (let x = 0; x < 11; x++) {
          if (E.tile(x, y) === 'A') { pxy = { x, y }; break; }
        }
        if (pxy) T.openMonsterProbe(w.GAME_DATA.monsters.A, pxy.x, pxy.y);
        await wait(600);
      } else if (scene === 'dpadclosed' || scene === 'dpadopen') {
        // 方向键收起/展开态：设置已在 iframe 加载前预置好
        d.getElementById('btnNew').click();
        await wait(200);
        const _vc = d.querySelector('#vowCards .vow-card[data-vow="none"]');
        if (_vc) _vc.click();
        await wait(260);
        const dlD = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlD.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        await wait(400);
        const wrapD = d.getElementById('dpadWrap');
        const dpadState = 'DPAD scene=' + scene
          + ' hidden=' + wrapD.classList.contains('dpad-hidden')
          + ' toggle=' + d.getElementById('dpadToggle').textContent
          + ' visible=' + (d.getElementById('dpad').offsetHeight > 0)
          + ' err=' + (errs.length ? errs.join('|') : 'none');
        document.title = dpadState;
        errBox.textContent = dpadState;
        window.__dpadState = dpadState;
        await wait(600);
      } else if (scene === 'showcase') {
        // 遗物高光特效播放中的一帧：延迟环负年龄曾把 arc() 炸成 IndexSizeError 冻结画面，
        // 这里触发后紧贴时间轴截图——特效在飞、画面在动，regression 直接看这张图。
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcs = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vcs) _vcs.click();
        await wait(260);
        const dlS = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlS.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        T.refreshHud();
        await wait(300);
        w.__tm.testRelicShowcase();
        await wait(140); // 延迟环 start=+140ms 恰好处于负年龄→激活的边界带
        errBox.textContent = 'SHOWCASE frameErrors=' + ((w.__tmRenderErrors || []).length)
          + ' err=' + (errs.length ? errs.join('|') : 'none');
        await wait(60);
      } else if (scene === 'death') {
        // 死亡结算：直接把状态摆进 over + hp=0，调 showDeath 看灰调面板与「折戟」塔印
        // 折戟成就链路：连死 3 次 → falls 累计到 3 → 「塔的常客」解锁（recordRun 每次都记，deathShown 只挡面板）
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcd = d.querySelector('#vowCards .vow-card[data-vow="guard"]');
        if (_vcd) _vcd.click();
        await wait(260);
        const sd = E.state();
        sd.over = true; sd.hp = 0; sd.floor = 8; sd.flags.killCount = 37;
        sd.flags.worstHit = 1225; sd.flags.worstName = '钟妖';
        T.showDeath({ name: '钟妖' }, 1225);
        await wait(300);
        // 第 2、3 次死：deathAgain 清防重入标记后重调，falls 应累到 3
        for (let di = 0; di < 2; di++) {
          const sdx = E.state();
          sdx.over = true; sdx.hp = 0; sdx.floor = 10 - di; sdx.flags.killCount = 40;
          w.__tm.deathAgain({ name: '钟妖' }, 900);
          await wait(150);
        }
        const fallsNow = w.__tm && w.__tm.Meta && w.__tm.Meta.memory ? w.__tm.Meta.memory.falls : -1;
        q2push('falls=' + fallsNow);
        q2push('achFall3=' + (w.Achievements && w.Achievements.isUnlocked('fall3') ? 'in' : 'MISS'));
        q2push('achFall10=' + (w.Achievements && w.Achievements.isUnlocked('fall10') ? 'WRONG-unlocked' : 'notyet-ok'));
        await wait(100);
      } else if (scene === 'adsdeath') {
        // 广告卡点（?ads=1 才显形）：看「看视频复活」在灰调死亡面板里的位置
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcdA = d.querySelector('#vowCards .vow-card[data-vow="guard"]');
        if (_vcdA) _vcdA.click();
        await wait(260);
        const sdA = E.state();
        sdA.over = true; sdA.hp = 0; sdA.floor = 8; sdA.flags.killCount = 37;
        sdA.flags.worstHit = 1225; sdA.flags.worstName = '钟妖';
        T.showDeath({ name: '钟妖' }, 1225);
        await wait(400);
      } else if (scene === 'adsend') {
        // 广告卡点（?ads=1 才显形）：结算页「余烬翻倍」按钮位置
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcdB = d.querySelector('#vowCards .vow-card[data-vow="guard"]');
        if (_vcdB) _vcdB.click();
        await wait(260);
        const se = E.state();
        se.ending = 'plain'; se.won = true; se.floor = 11; se.flags.killCount = 40;
        // 先用「真结局+断剑」播一次（留下秤的纸条与断剑去处），再切平结局重播——
        // 验证动态行被正确清理，不残留到第二局（6592dc7 曾埋过这个 bug）
        se.ending = 'true'; se.flags.relic_edge = true;
        T.showEnd();
        await wait(400);
        se.ending = 'plain';
        se.flags.relic_edge = false; se.flags.hasBlock = false; se.flags.hasBlock2 = false;
        T.showEnd();
        await wait(600);
      } else if (scene === 'collection') {
        // 收藏图鉴：预置一批「见过」的记录，检查 11 遗物 + 24 锁环（4 章分组）的卡片排版
        d.getElementById('btnNew').click();
        await wait(200);
        const _vcc = d.querySelector('#vowCards .vow-card[data-vow="' + VOWPICK + '"]');
        if (_vcc) _vcc.click();
        await wait(260);
        const dlC = d.getElementById('dialogOverlay');
        for (let i = 0; i < 8; i++) { dlC.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
        const sc = E.state();
        // 一半见过的状态：遗物 6/11、锁环 9/24 —— 亮卡与灰卡同屏，排版问题一眼可见
        sc.flags.relic_ward = true; sc.flags.relic_edge = true; sc.flags.relic_steel = true;
        sc.flags.relic_thrift = true; sc.flags.relic_gate = true; sc.flags.relic_coin = true;
        sc.flags.rings = ['ledger', 'lamp', 'coin', 'parry', 'cinder', 'bell', 'stair', 'seventh', 'chisel'];
        T.refreshHud();
        await wait(200);
        T.openCollection();
        await wait(400);
        // 提示行口径验证写进外层 err（dump-dom 不展开 iframe 内 DOM）
        const hintTxt = (d.getElementById('colHint') || {}).textContent || '';
        q2push('collHint=' + (hintTxt.includes('随机池') && hintTxt.includes('固定') ? 'split-ok' : 'OLD:' + hintTxt.slice(0, 30)));
        // 「下一件」前三位不应含随机池遗物（有固定来源件剩余时）
        const nextKinds = Array.from(d.querySelectorAll('.col-next-chip')).map((b) => b.dataset.id);
        q2push('next3=' + nextKinds.join(','));
        q2push('COLLECTION ' + T.collectionText());
      }
      await wait(600);
      const q2 = Q2.slice();   // 场景分支里可能已经 q2push 过
      if (q.get('measure') === '1') ['bsHeroBar','bsFoeBar','bsHero','bsFoe','bsName','battleScene'].forEach((id) => {
        const n = d.getElementById(id);
        if (!n) return;
        const r = n.getBoundingClientRect();
        q2.push(id + ':' + Math.round(r.width) + 'x' + Math.round(r.height) + '@' + Math.round(r.left) + ',' + Math.round(r.top) + ' bg=' + getComputedStyle(n).width);
      });
      if (q.get('scene') === 'end') {
        const p = d.querySelector('.end-epi-scale');
        q2.push('scaleNote=' + (p ? p.textContent.slice(0, 24) : 'MISSING')
          + ' swordLine=' + (d.getElementById('endEpi').textContent.includes('断剑') ? 'in' : 'MISS'));
      }
      if (q.get('scene') === 'board' && q.get('measure') === '1') {
        // 脚注换行后重测：川那行名字格不得再溢出（nowrap 已放开为两行）
        const rows = Array.from(d.querySelectorAll('.bd-row .bd-name'));
        const nm = rows.find((el) => el.textContent.includes('川'));
        if (nm) {
          const r = nm.getBoundingClientRect();
          q2.push('chuanRowH=' + Math.round(r.height) + ' overflow=' + (nm.scrollWidth > nm.clientWidth ? 'YES' : 'no')
            + ' fullText=' + nm.textContent + ' @' + window.innerWidth);
        } else q2.push('chuanRow=MISSING rows=' + rows.length);
      }
      // sword 场景：sword 分支内部已把全链路断言写进 errBox（out 数组），此处不再覆盖；
      // 若走到这里 errBox 仍是空的，说明分支中途抛错且未被捕获——补一行现场
      if (q.get('scene') === 'sword' && !errBox.textContent) {
        errBox.textContent = 'SWORD-INCOMPLETE iframeErr=' + (errs.join('|') || 'none');
      }
      errBox.textContent = (errs.length ? 'JS 错误：\n' + errs.join('\n') : '') + (q2.length ? '\n' + q2.join('\n') : '');
    } catch (e) {
      errBox.textContent = 'HARNESS: ' + e.message;
    }
  };
</script>
</body>
</html>
