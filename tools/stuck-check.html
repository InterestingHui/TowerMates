<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>stuck-check</title>
<style>
body{margin:0;background:#05070c;color:#8ef;font:12.5px/1.6 monospace}
#f{width:430px;height:900px;border:0;display:block}
#out{padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="f" src="/index.html?dev=1"></iframe>
<pre id="out">running…</pre>
<script>
// 「打不过」预警归属探针：弱属性玩家直接撞第 3 层墨妖，看各条提示分别出自谁之口。
// 口径：预警（tooStrongBoss）必须由烛/秤说；Boss 自己的战前对白（bossYan）不许在「打不过」路径出现。
const f = document.getElementById('f');
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const R = [];
function rec(name, ok, note) {
  R.push({ name, ok: !!ok, note: note || '' });
  out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n');
  document.title = (R.every((r) => r.ok) ? 'ALLPASS|' : 'HASFAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
}
async function waitFor(fn, timeout = 8000, step = 20) {
  const t0 = performance.now();
  while (performance.now() - t0 < timeout) {
    let v = null;
    try { v = fn(); } catch (e) {}
    if (v) return v;
    await wait(step);
  }
  return null;
}
f.onload = async () => {
  try {
    const w = f.contentWindow, d = f.contentDocument;
    await waitFor(() => w.__tm && w.__tm.playStory);
    await wait(400);
    const dlg = () => d.getElementById('dialogOverlay');
    const who = () => d.getElementById('dlgWho').textContent;
    const text = () => d.getElementById('dlgText').textContent;
    const clickDlg = async (n) => { for (let i = 0; i < n; i++) { dlg().dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(60); } };

    // 2026-11-28 多塔：探针只验卡关提示，不验开局流程。
    // 直接以主塔基线开局并关掉所有遮罩，避免序章/塔群把对白层占住。
    w.Engine.newGame(null, { tower: 'main' });
    d.querySelectorAll('.overlay.show').forEach(function (o) { o.classList.remove('show'); });
    w.__tm.refreshHud();
    await wait(300);

    // 削弱玩家：攻 1（远低于墨妖防 16），血压到最低——保证「打不过」两条路径都触发
    const s = w.Engine.state();
    s.floor = 2;                       // 第 3 层（0 基）
    s.atk = 1; s.def = 0; s.hp = 120; s.maxHp = 3000; s.gold = 0;
    // 找到墨妖格子，把玩家挪到它正下方
    const map = s.maps[2];
    let mx = -1, my = -1;
    for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) if (map[y][x] === 'N') { mx = x; my = y; }
    rec('找到墨妖格', mx >= 0, `N@(${mx},${my})`);
    // 墨妖上方那格是 '#'（地图第 4 行 '#.#y......#'，N 在第 6 行 x=5），可通行格取它四周可走的
    let hx = -1, hy = -1;
    for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const ch = map[my + oy] && map[my + oy][mx + ox];
      if (ch && ch !== '#') { hx = mx + ox; hy = my + oy; break; }
    }
    s.x = hx; s.y = hy;
    w.__tm.refreshHud();
    await wait(200);

    // 直接撞墨妖
    const dx = mx - hx, dy = my - hy;
    w.__tm.resolveBattle(dx, dy);
    await wait(500);

    // 采集现场：谁在说话？说了什么？卡关条内容？
    const whoNow = who();
    const textNow = text();
    const stuckHidden = d.getElementById('stuckBar').hidden;
    const stuckText = d.getElementById('stuckText').textContent;
    const warnPill = d.getElementById('warnPill').classList.contains('show') ? d.getElementById('warnPill').textContent : '';
    const biShown = d.getElementById('bossIntroOverlay').classList.contains('show');
    rec('预警不是墨妖自己说的', whoNow !== '墨妖', `who="${whoNow}"`);
    rec('预警由引导者开口（烛/秤）', whoNow === '烛' || whoNow === '秤', `who="${whoNow}" text="${textNow.slice(0, 40)}"`);
    rec('Boss 出场卡未在打不过路径弹出', !biShown);
    rec('卡关条挂出', !stuckHidden, stuckText.slice(0, 50));
    rec('卡关条有说话人（秤）', /^秤\s·|秤：/.test(stuckText), stuckText.slice(0, 12));
    rec('warn 药丸不冒充墨妖', !/墨妖/.test(warnPill), warnPill.slice(0, 40));
    rec('warn 药丸带引导者归属', !warnPill || /烛/.test(warnPill), warnPill.slice(0, 24));

    // 点掉对白后：Boss 站前对白（bossYan 剧本）也不许接续弹出
    await clickDlg(10);
    await wait(400);
    const whoAfter = dlg().classList.contains('show') ? who() : '';
    const textAfter = dlg().classList.contains('show') ? text() : '';
    rec('后续对白也不是墨妖战前剧本', !/名册上你的名字/.test(textAfter), `who="${whoAfter}" text="${textAfter.slice(0, 30)}"`);

    out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n')
      + '\n\n' + (R.every((r) => r.ok) ? 'ALL PASS' : 'HAS FAIL');
    document.title = (R.every((r) => r.ok) ? 'ALLPASS|' : 'HASFAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
  } catch (e) {
    out.textContent = 'HARNESS: ' + e.message + '\n' + (e.stack || '');
    document.title = 'ERR|' + e.message;
  }
};
</script>
</body>
</html>
