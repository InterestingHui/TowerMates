<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>弹层多视口自检</title>
<style>html,body{margin:0;background:#05070c;color:#7ef0b2;font:13px/1.5 monospace}#out{white-space:pre-wrap;padding:8px}</style>
</head>
<body>
<pre id="out">pending</pre>
<div id="host" style="position:absolute;left:-30000px;top:0"></div>
<script>
// 弹层多视口自检（闸门用）：
// vp-check 只量了主界面（棋盘/顶栏/底栏），但玩家真正会被卡住的是「弹层里那颗按钮够不够得着」——
// 战斗演出的 overlay 是 overflow:hidden 且面板没有滚动，横屏矮屏下按钮一旦掉出视口就永远点不到；
// 商店/榜单/图鉴的 .panel 是 92dvh + 内滚，要确认「主按钮能不能不滚就看见」与「内容有没有横向溢出」。
const CASES = [
  { w: 390, h: 844, tag: '竖屏基准' },
  { w: 844, h: 390, tag: '手机横屏' },
  { w: 320, h: 568, tag: '小屏' },
  { w: 844, h: 320, tag: '极矮横屏' },
];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// 等条件成立（最多 ms）：闸门在整机跑时 CPU 被前面几十项占着，
// 固定 sleep 会在「商店还没画完」时量到空列表——空列表量出来的全绿/全红都是假读数
const waitFor = async (fn, ms) => {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 2500)) {
    try { if (fn()) return true; } catch (e) {}
    await wait(60);
  }
  return false;
};
const out = document.getElementById('out');
const detail = [];
const bits = [];
const dumps = [];

function check(name, ok, extra) {
  bits.push(ok ? '1' : '0');
  detail.push((ok ? '✓ ' : '✗ ') + name + (extra ? ' · ' + extra : ''));
}

function measurePanel(frame, sel) {
  const doc = frame.contentDocument;
  const p = doc.querySelector(sel);
  if (!p) return null;
  const r = p.getBoundingClientRect();
  const cs = frame.contentWindow.getComputedStyle(p);
  const btns = Array.from(p.querySelectorAll('button')).filter((b) => !b.hidden && b.offsetParent !== null).map((b) => {
    const br = b.getBoundingClientRect();
    // clip：文字被省略号吃掉时 scrollWidth 会大于 clientWidth——「按钮在视口里」与
    // 「按钮上的字看得全」是两件事，2026-11-16 才把后者也量上（加练 焦点A）
    return { id: b.id || b.className, top: Math.round(br.top), bottom: Math.round(br.bottom), h: Math.round(br.height), w: Math.round(br.width), clip: b.scrollWidth > b.clientWidth + 1 };
  });
  return {
    r: { top: Math.round(r.top), bottom: Math.round(r.bottom), left: Math.round(r.left), right: Math.round(r.right), h: Math.round(r.height), w: Math.round(r.width) },
    scrollY: p.scrollHeight > p.clientHeight + 1,
    overflowX: p.scrollWidth > p.clientWidth + 1,
    overflow: cs.overflowY,
    btns: btns,
  };
}

(async () => {
  for (const c of CASES) {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:' + c.w + 'px;height:' + c.h + 'px;border:0;display:block';
    f.src = '/index.html?dev=1#demo=3,5,5';
    document.getElementById('host').appendChild(f);
    await wait(1400);
    const w = f.contentWindow;
    const d = f.contentDocument;
    try {
      try { w.Renderer.layout(d.getElementById('stage')); } catch (e) {}
      await wait(60);

      // ---- 1) 战斗演出（overlay overflow:hidden、面板无滚动：按钮必须在视口里）----
      {
        const s = w.Engine.state();
        s.atk = 40; s.def = 20; s.hp = 800; s.maxHp = 1000;
        s.flags.hasBlock = true; s.flags.rings = ['twice'];
        w.__tm.refreshHud();
        w.__battleSpeed = 30;
        w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowUp' }));
        await wait(340);
        const m = measurePanel(f, '#battleScene .bs-panel');
        const shown = d.getElementById('battleScene').classList.contains('show');
        dumps.push(c.tag + ' battle ' + JSON.stringify({ shown, m }));
        if (!m) {
          check(c.tag + ' 战斗面板可读', false);
        } else {
          const tag = c.tag + ' 战斗面板';
          check(tag + ' 整块在视口内', m.r.top >= -1 && m.r.bottom <= c.h + 1, m.r.top + '–' + m.r.bottom + ' / ' + c.h);
          check(tag + ' 每个打法按钮都完整可点', m.btns.length >= 1 && m.btns.every((b) => b.top >= -1 && b.bottom <= c.h + 1 && b.h >= 30),
            m.btns.map((b) => b.id + ':' + b.top + '–' + b.bottom).join(' ') || '无按钮');
          // 三把打法的读数一句比一句长（「此后 N 场 · 每场 −15% · 这战剩 528」），
          // 窄屏上最先坏的不是「按钮掉出视口」而是「字被省略号吃成半句」
          check(tag + ' 打法读数整句可见', m.btns.length >= 1 && m.btns.every((b) => !b.clip),
            m.btns.map((b) => b.id + (b.clip ? ':裁切' : ':' + b.w + 'px')).join(' ') || '无按钮');
        }
        try { d.getElementById('battleScene').classList.remove('show'); w.__battleSpeed = 30; } catch (e) {}
        await wait(120);
      }

      // ---- 2) 商店（长列表 + 主按钮）----
      {
        w.__tm.openShop();
        await wait(200);
        await waitFor(() => d.querySelectorAll('#shopOverlay .shop-item').length >= 3, 2500);
        const m = measurePanel(f, '#shopOverlay .panel');
        dumps.push(c.tag + ' shop ' + JSON.stringify(m));
        if (!m) check(c.tag + ' 商店面板可读', false);
        else {
          const tag = c.tag + ' 商店';
          const close = m.btns.find((b) => b.id === 'shopClose');
          check(tag + ' 面板不横向溢出', !m.overflowX, 'scrollW>clientW ' + m.overflowX);
          check(tag + ' 离开按钮不滚就看得见', !!close && close.top >= -1 && close.bottom <= c.h + 1,
            close ? close.top + '–' + close.bottom + ' / ' + c.h : '缺按钮');
          // 副标题必须整句可见：曾经是单行 nowrap + ellipsis，「承伤降到 55%」这个关键数字
          // 正好被截在省略号里（第 3 层唯一的补学机会，玩家看不到代价）
          const tips = Array.from(d.querySelectorAll('#shopOverlay .shop-item .si-tip'));
          const cut = tips.filter((t) => t.scrollWidth > t.clientWidth + 1 || t.scrollHeight > t.clientHeight + 1);
          check(tag + ' 货架副标题整句可见', tips.length > 0 && cut.length === 0,
            cut.length ? cut.map((t) => t.textContent.slice(0, 10)).join(' / ') : tips.length + ' 件全部完整');
        }
        try { d.getElementById('shopClose').click(); } catch (e) {}
        await wait(120);
      }

      // ---- 3) 塔友榜（列表 + 两行输入 + 关闭）----
      {
        w.__tm.openBoard();
        await wait(200);
        const m = measurePanel(f, '#boardOverlay .panel');
        dumps.push(c.tag + ' board ' + JSON.stringify(m));
        if (!m) check(c.tag + ' 榜单面板可读', false);
        else {
          const tag = c.tag + ' 榜单';
          const close = m.btns.find((b) => b.id === 'boardClose');
          check(tag + ' 面板不横向溢出', !m.overflowX);
          check(tag + ' 关闭按钮不滚就看得见', !!close && close.top >= -1 && close.bottom <= c.h + 1,
            close ? close.top + '–' + close.bottom + ' / ' + c.h : '缺按钮');
        }
        try { d.getElementById('boardClose').click(); } catch (e) {}
        await wait(120);
      }

      // ---- 4) 图鉴（最长的列表 + 分段页签）----
      {
        w.__tm.openCollection();
        await wait(240);
        const m = measurePanel(f, '#collectionOverlay .collection-panel');
        dumps.push(c.tag + ' codex ' + JSON.stringify(m));
        if (!m) check(c.tag + ' 图鉴面板可读', false);
        else {
          const tag = c.tag + ' 图鉴';
          const close = m.btns.find((b) => (b.id || '').indexOf('collection') >= 0 || (b.id || '').indexOf('Close') >= 0 || (b.id || '').indexOf('close') >= 0);
          check(tag + ' 面板不横向溢出', !m.overflowX);
          check(tag + ' 面板底边不出视口', m.r.bottom <= c.h + 1, m.r.bottom + ' / ' + c.h);
          check(tag + ' 关闭按钮不滚就看得见', !close || (close.top >= -1 && close.bottom <= c.h + 1),
            close ? close.id + ' ' + close.top + '–' + close.bottom : '未找到（不断言）');
        }
        try { w.__tm.closeCollection(); } catch (e) {}
        await wait(120);
      }

      // ---- 5) 章末回响（章末必经：三选一 + 「继续上楼」，原来没写 max-height）----
      {
        const s2 = w.Engine.state();
        s2.floor = 2;
        s2.flags.goal_0 = s2.flags.goal_1 = s2.flags.goal_2 = true;
        const ec = w.Engine.settleChapter(1);
        w.__tm.openEcho(ec);
        await wait(400);
        d.getElementById('echoClose').hidden = false;   // 最坏情况：三选一后那颗按钮得够得着
        await wait(120);
        const m = measurePanel(f, '#echoOverlay .echo-panel');
        dumps.push(c.tag + ' echo ' + JSON.stringify(m));
        if (!m) check(c.tag + ' 回响面板可读', false);
        else {
          const tag = c.tag + ' 回响';
          const btn = m.btns.find((b) => b.id === 'echoClose');
          check(tag + ' 面板不出视口', m.r.top >= -1 && m.r.bottom <= c.h + 1, m.r.top + '–' + m.r.bottom + ' / ' + c.h);
          check(tag + ' 继续上楼不滚就看得见', !!btn && btn.top >= -1 && btn.bottom <= c.h + 1,
            btn ? btn.top + '–' + btn.bottom + ' / ' + c.h : '缺按钮');
        }
        try { d.getElementById('echoClose').click(); } catch (e) {}
        await wait(150);
      }

      // ---- 6) 路遇（第 7 层起 7 层都有：3 个选项 + 长文案，09:5x 给别的弹层补 max-height 时漏了这块）----
      {
        const sEv = w.Engine.state();
        sEv.gold = 0;                       // 付不起：看禁用选项还写不写「它给什么」
        w.__tm.openEvent('veteran');
        await wait(260);
        const p = d.querySelector('#eventOverlay .event-panel');
        const r = p.getBoundingClientRect();
        const opts = Array.from(p.querySelectorAll('.ev-opt'));
        const info = opts.map((b) => {
          const sm = b.querySelector('small');
          const br = b.getBoundingClientRect();
          return {
            label: (b.querySelector('b') || {}).textContent || '', dis: b.disabled,
            top: Math.round(br.top), bottom: Math.round(br.bottom),
            small: sm.textContent,
            clip: sm.scrollWidth > sm.clientWidth + 1 || sm.scrollHeight > sm.clientHeight + 1,
          };
        });
        dumps.push(c.tag + ' event ' + JSON.stringify({ r: { top: Math.round(r.top), bottom: Math.round(r.bottom), h: Math.round(r.height) }, opts: info }));
        const tag = c.tag + ' 路遇';
        check(tag + ' 面板不出视口', r.top >= -1 && r.bottom <= c.h + 1, Math.round(r.top) + '–' + Math.round(r.bottom) + ' / ' + c.h);
        check(tag + ' 每个选项的代价整句可见', opts.length >= 2 && info.every((o) => !o.clip && o.small.length > 0),
          info.map((o) => o.label + (o.clip ? ':裁切' : '')).join(' '));
        // 最后一项必须能滚到（极矮横屏下 3 个两行选项放不下时，滚动是唯一的补救）
        p.scrollTop = p.scrollHeight;
        await wait(80);
        const last = opts[opts.length - 1].getBoundingClientRect();
        check(tag + ' 最后一项滚得到', last.top >= -1 && last.bottom <= c.h + 1, Math.round(last.top) + '–' + Math.round(last.bottom) + ' / ' + c.h);
        p.scrollTop = 0;

        // 付不起的那一条：旧版把整句 tip 换成「还差 N 金」，等于在最该看清取舍的一刻把账藏了
        w.__tm.openEvent('herbalist');
        await wait(220);
        const dis = Array.from(d.querySelectorAll('#eventOverlay .ev-opt')).filter((b) => b.disabled)[0];
        const dsm = dis ? dis.querySelector('small').textContent : '';
        check(tag + ' 付不起时仍写着它给什么', !!dis && dsm.indexOf('还差') >= 0 && dsm.indexOf(' · ') > 0 && dsm.length > dsm.indexOf('还差') + 5,
          dis ? dsm : '没有禁用选项（场景失效）');

        // 另一种「付不起」：用掉这一层的格挡（11-16 路遇去同构新增的代价）。
        // 理由必须说人话（没学 / 禁挡誓约 / 已用光），且仍要写清这个选项给什么。
        // 造状态而不是碰运气：直接把这层的格挡记成用光，探针在哪个 run 上都成立。
        {
          const st = w.Engine.state();
          const keepHas = st.flags.hasBlock;
          const keepN = st.flags['block_n' + st.floor];
          st.flags.hasBlock = true;
          st.flags['block_n' + st.floor] = 9;
          w.__tm.openEvent('vent');
          await wait(240);
          const vopts = Array.from(d.querySelectorAll('#eventOverlay .ev-opt'));
          const vdis = vopts.filter((b) => b.disabled)[0];
          const vsm = vdis ? vdis.querySelector('small') : null;
          const vtxt = vsm ? vsm.textContent : '';
          check(tag + ' 格挡付不起时仍写着它给什么',
            !!vdis && vtxt.indexOf('格挡') >= 0 && vtxt.indexOf('攻击 +1') >= 0 && vtxt.indexOf(' · ') > 0,
            vdis ? vtxt : '没有禁用选项（场景失效）');
          check(tag + ' 格挡代价那句整句可见', !!vsm && vsm.scrollWidth <= vsm.clientWidth + 1,
            vsm ? vsm.scrollWidth + '/' + vsm.clientWidth : '缺 small');
          try { d.getElementById('eventOverlay').classList.remove('show'); } catch (e) {}
          st.flags.hasBlock = keepHas;
          if (keepN === undefined) delete st.flags['block_n' + st.floor];
          else st.flags['block_n' + st.floor] = keepN;
          await wait(80);
        }
        try { d.getElementById('eventOverlay').classList.remove('show'); } catch (e) {}
        await wait(120);
      }

      // ---- 7) 结算页（本作最长的一屏：分项 + 码 + 两个出口）----
      {
        d.getElementById('btnNew').click();
        await wait(260);
        const vc = d.querySelector('#vowCards .vow-card');
        if (vc) vc.click();
        await wait(320);
        const s3 = w.Engine.state();
        if (s3) { s3.ending = 'true'; s3.won = true; s3.startedAt = Date.now() - 360000; }
        w.__tm.showEnd();
        await wait(1500);
        const m = measurePanel(f, '#endOverlay .end-panel');
        dumps.push(c.tag + ' end ' + JSON.stringify({ r: m && m.r, btns: m && m.btns.filter((b) => b.id) }));
        if (!m) check(c.tag + ' 结算页可读', false);
        else {
          const tag = c.tag + ' 结算页';
          const again = m.btns.find((b) => b.id === 'btnAgain');
          check(tag + ' 面板不出视口', m.r.top >= -1 && m.r.bottom <= c.h + 1, m.r.top + '–' + m.r.bottom + ' / ' + c.h);
          check(tag + ' 再来一局不滚就看得见', !!again && again.top >= -1 && again.bottom <= c.h + 1,
            again ? again.top + '–' + again.bottom + ' / ' + c.h : '缺按钮');
          // 这一屏真正的信息主体是两块标签（13 行分项 + 「塔的记忆」），此前只量过按钮够不够得着。
          // 两列的 .mem-grid 与逐条的目标最容易在窄屏被 ellipsis 吃掉半句（"决战结束时（现 46…"）
          const clipOf = (els) => els.filter((el) => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1);
          const cutTxt = (els) => els.map((e) => e.textContent.trim().slice(0, 8)).join('/');
          const statCells = Array.from(d.querySelectorAll('#endStats > div'));
          const statCut = clipOf(statCells);
          check(tag + ' 分项标签整句可见', statCells.length >= 12 && statCut.length === 0,
            statCells.length + ' 行' + (statCut.length ? ' · 裁切：' + cutTxt(statCut) : ''));
          const memRows = Array.from(d.querySelectorAll('#endMemory .mem-grid > div'));
          const memCut = clipOf(memRows);
          check(tag + ' 履历每行整句可见', memRows.length >= 5 && memCut.length === 0,
            memRows.length + ' 行' + (memCut.length ? ' · 裁切：' + cutTxt(memCut) : ''));
          const goalRows = Array.from(d.querySelectorAll('#endMemory .mem-goals span'));
          const goalCut = clipOf(goalRows);
          check(tag + ' 下一局目标整句可见', goalRows.length >= 1 && goalCut.length === 0,
            goalRows.length + ' 条' + (goalCut.length ? ' · 裁切：' + cutTxt(goalCut) : ''));
          // 2026-11-17 新加的分享出口（「把这一局发给朋友」）。结算页是内滚长屏，
          // 码本身就在最底下（玩家要滚过整份账才看到自己的码），所以按钮跟码一起在底部是**对的**——
          // 要守的不是「首屏可见」，而是①按钮够宽（不被挤成窄条）②滚到底时不被
          // sticky 钉底的「再来一局」盖住（盖住就是一颗点不动的按钮）。
          const es0 = m.btns.find((b) => b.id === 'btnEndShare');
          check(tag + ' 分享出口在、且够宽',
            !!es0 && es0.w >= 100,
            es0 ? es0.w + 'x' + es0.h : '缺按钮');
          {
            const pane = d.querySelector('#endOverlay .end-panel');
            if (pane) pane.scrollTop = pane.scrollHeight;
            await wait(90);
            const m2 = measurePanel(f, '#endOverlay .end-panel');
            const es1 = m2 && m2.btns.find((b) => b.id === 'btnEndShare');
            const ag1 = m2 && m2.btns.find((b) => b.id === 'btnAgain');
            check(tag + ' 滚到底时分享按钮在可视区内、不被「再来一局」盖住',
              !!es1 && !!ag1 && es1.top >= m2.r.top - 1 && es1.bottom <= ag1.top + 1,
              es1 && ag1 ? es1.top + '–' + es1.bottom + ' ≤ 再来一局 ' + ag1.top : '缺按钮');
          }
        }
      }
    } catch (e) {
      check(c.tag + ' 探针跑通', false, String((e && e.message) || e));
    }
    f.remove();
    await wait(150);
  }
  const all = bits.every((b) => b === '1');
  out.textContent = detail.join('\n') + '\n'
    + 'DUMP|' + dumps.join('\nDUMP|') + '\n'
    + (all ? 'ALLPASS|' : 'HASFAIL|') + bits.join('') + '\n';
})();
</script>
</body>
</html>
