<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>newplayer-check</title>
<style>
body{margin:0;background:#05070c;color:#8ef;font:12.5px/1.6 monospace}
#f{width:430px;height:780px;border:0;display:block}
#out{padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="out">running…</pre>
<script>
// 焦点 D · 新内容可理解性：假装新玩家，只靠游戏内信息回答「这是什么/什么时候能用」
// 检查对象：战意（236c51b）、双路线勋章、余裕档案、锁环手册、誓约重排后的立誓面板
const f = document.getElementById('f');
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const R = [];
function rec(name, ok, note) {
  R.push({ name, ok: !!ok, note: note || '' });
  out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n');
  document.title = (R.every((r) => r.ok) ? 'ALLPASS|' : 'HASFAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
}
async function waitFor(fn, timeout = 8000, step = 25) {
  const t0 = performance.now();
  while (performance.now() - t0 < timeout) {
    let v = null;
    try { v = fn(); } catch (e) {}
    if (v) return v;
    await wait(step);
  }
  return null;
}
function load(url) { return new Promise((res) => { f.onload = () => res(); f.src = url; }); }

(async () => {
  try {
    // ===== A. 新玩家第一次开局：立誓面板能不能看懂 =====
    // 预置老玩家档（runs=1），让余烬注释消失、余额行出现——模拟「第二次进塔」的典型状态
    await load('/index.html?dev=1&p=d1');
    let w = f.contentWindow, d = f.contentDocument;
    await waitFor(() => w.__tm && w.Engine && w.__tm.openVow);
    await wait(400);
    {
      const raw = JSON.parse(w.localStorage.getItem('towermates_meta') || '{}');
      raw.memory = Object.assign({}, raw.memory || {}, { runs: 1 });
      raw.ember = 12;
      w.localStorage.setItem('towermates_meta', JSON.stringify(raw));
      await load('/index.html?dev=1&p=d2');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.Engine && w.__tm.openVow);
      await wait(400);
      w.__tm.openVow();
      await wait(400);
      // 余额行只有数量：新玩家看得到 ✦ 12，但没有「余烬」二字——他知不知道这是什么？
      const emberLine = d.getElementById('vowEmber');
      const txt = emberLine && !emberLine.hidden ? emberLine.textContent.trim() : '';
      rec('A1 立誓面板余额只显示数量', /^✦\s*\d+$/.test(txt), `显示「${txt}」`);
      // 锁条 chip：没解锁的人能看到「🔒 苦行之誓 · 还差 N ✦」——数量出处可循
      const chip = d.querySelector('.vow-chip');
      rec('A2 锁定誓约 chip 有数量指引', !!chip && /还差 \d+ ✦|可解锁 \d+ ✦/.test(chip.textContent), chip ? chip.textContent.trim() : '缺失');
      // 新手注释（vowEmberNote）：runs=1 时应隐藏——但注释隐藏后 ✦ 12 的「✦」还剩多少解释力？
      const note = d.getElementById('vowEmberNote');
      rec('A3 老玩家不再看「余烬是什么」注释', note && note.hidden === true, note ? 'hidden=' + note.hidden : '缺失');
    }

    // ===== B. 战意：战斗中首见能不能自解释 =====
    await load('/index.html?dev=1&p=d3#demo=0,4,5');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => w.__tm && w.Engine && w.Engine.state());
    await wait(500);
    {
      const st = w.Engine.state();
      st.atk = 400; st.def = 400; st.maxHp = 9999; st.hp = 9999; st.flags.killCount = 45;
      st.flags['traitSeen_double'] = 1;
      w.__tm.refreshHud();
      // 砚在第 3 层 (5,5)——但这里在第 1 层，先打右侧普通怪 B(6,5) 看普通怪不吃战意
      w.__tm.resolveBattle(1, 0);
      await wait(400);
      const zealRow = d.querySelector('.bs-zeal');
      const zealVisible = zealRow && zealRow.offsetHeight > 0 && (zealRow.textContent || '').trim();
      rec('B1 普通怪战不亮战意行', !zealVisible, zealVisible ? `出现了「${zealRow.textContent.trim()}」` : '干净（未显示或隐藏）');
      const bs = d.getElementById('battleScene');
      if (bs.classList.contains('show')) { bs.click(); await waitFor(() => !bs.classList.contains('show'), 6000); }
      await wait(300);
      // 最终决战才有战意：用 Engine.zealScale 验证数值语义（≥40 杀 → −36%）
      const U = w.GAME_DATA && Object.keys(w.GAME_DATA.monsters).find((k) => w.GAME_DATA.monsters[k].finalBoss);
      const scale = U ? w.Engine.zealScale(w.GAME_DATA.monsters[U]) : null;
      rec('B2 战意数值语义（45杀→0.64）', scale === 0.64, 'scale=' + scale);
    }

    // ===== C. 收藏图鉴的「余裕档案」：有过结局后才显示「两条路」行 =====
    {
      // 造一条通关档案（marginCounts 有值 → marginStatBoard 走完整分支）
      const raw = JSON.parse(w.localStorage.getItem('towermates_meta') || '{}');
      raw.memory = Object.assign({}, raw.memory || {}, { runs: 2, marginCounts: { A: 1 }, marginBest: 'A' });
      w.localStorage.setItem('towermates_meta', JSON.stringify(raw));
      await load('/index.html?dev=1&p=d5#demo=0,4,5');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => { try { return w.__tm && w.Engine && w.Engine.state && w.Engine.state(); } catch (e) { return null; } }, 10000);
      await wait(500);
      w.__tm.openCfg && w.__tm.openCfg();
      await wait(300);
      const colBtn = d.getElementById('cfgCollection');
      if (colBtn) colBtn.click();
      await wait(600);
      const colEl = d.getElementById('collectionOverlay');
      const colTxt = colEl ? (colEl.textContent || '') : '';
      rec('C1 图鉴余裕档案有「两条路」说明', /两条路/.test(colTxt), (colTxt.match(/两条路[^<]*/g) || ['未找到'])[0].slice(0, 44));
      // 没拿过 S 的档案应给出「拿 S」提示行
      rec('C2 没 S 时给「拿 S」提示', /拿 S/.test(colTxt), (colTxt.match(/拿 S[^<]*/g) || ['未找到'])[0].slice(0, 40));
    }

    // ===== D. 结算摘要折叠：新玩家能不能发现被折叠的信息 =====
    await load('/index.html?dev=1&p=d4#demo=0,4,5');
    w = f.contentWindow; d = f.contentDocument;
    const st0 = await waitFor(() => { try { return w.__tm && w.Engine && w.Engine.state && w.Engine.state(); } catch (e) { return null; } }, 10000);
    if (!st0) { rec('D0 游戏未就绪', false, 'Engine.state 为空'); throw new Error('engine not ready'); }
    await wait(600);
    {
      const s = w.Engine.state();
      s.ending = 'plain'; s.won = true; s.floor = 11; s.flags.killCount = 40;
      try { w.__tm.showEnd(); } catch (e) { rec('D0 showEnd', false, e.message); }
      await wait(600);
      const brief = d.getElementById('endBrief');
      const toggle = brief && brief.querySelector('.brief-toggle');
      rec('D1 摘要折叠有展开入口', !!toggle, toggle ? toggle.textContent.trim() : '未折叠/缺失');
      if (toggle) {
        const extra = brief.querySelector('.brief-extra');
        const hiddenBefore = extra ? getComputedStyle(extra).display === 'none' : null;
        toggle.click();
        await wait(200);
        const hiddenAfter = extra ? getComputedStyle(extra).display === 'none' : null;
        rec('D2 点开能展开全部', hiddenBefore === true && hiddenAfter === false, `${hiddenBefore} → ${hiddenAfter}（extra 显隐）`);
      }
    }

    // ===== F. 最近两轮新内容：图鉴分区签 / 折戟预告 / 罗盘徽记 / 第七格条件 =====
    // F1/F2 图鉴分区签可辨识可跳转（新玩家要知道「成就」在下面）
    await load('/index.html?dev=1&p=f1#demo=0,4,5');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => { try { return w.__tm && w.__tm.openCollection && w.Engine.state(); } catch (e) { return null; } }, 10000);
    await wait(400);
    {
      const dlF = d.getElementById('dialogOverlay');
      for (let i = 0; i < 8; i++) { if (!dlF.classList.contains('show')) break; dlF.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
      w.__tm.openCollection();
      await wait(400);
      const jumps = Array.from(d.querySelectorAll('#colBody .col-jump-btn')).map((b) => b.textContent.trim());
      rec('F1 图鉴顶部有「藏品 / 成就」两枚跳转', jumps.length === 2 && jumps.join('') === '藏品成就', jumps.join(' / ') || '缺失');
      const achJump = d.querySelector('#colBody .col-jump-btn[data-jump="ach"]');
      if (achJump) achJump.click();
      const st = d.getElementById('colBody').scrollTop;
      rec('F2 点「成就」直达成就墙（滚动容器实滚）', st > 200, 'scrollTop=' + st);
    }
    // F3 折戟预告：累计折戟 2 次时，败局页应出现「再折戟 1 次」
    {
      const raw = JSON.parse(w.localStorage.getItem('towermates_meta') || '{}');
      raw.memory = Object.assign({}, raw.memory || {}, { runs: 3, falls: 1, lastFallFloor: 5 });
      w.localStorage.setItem('towermates_meta', JSON.stringify(raw));
      await load('/index.html?dev=1&p=f3#demo=0,4,5');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => { try { return w.__tm && w.__tm.showDeath && w.Engine.state(); } catch (e) { return null; } }, 10000);
      await wait(400);
      const dlG = d.getElementById('dialogOverlay');
      for (let i = 0; i < 8; i++) { if (!dlG.classList.contains('show')) break; dlG.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
      const sf = w.Engine.state();
      sf.over = true; sf.hp = 0; sf.floor = 4;
      w.__tm.showDeath({ name: '锈犬' }, 800);
      await wait(400);
      const briefTxt = (d.getElementById('endBrief') || {}).textContent || '';
      rec('F3 第 2 次折戟预告「再折戟 1 次」', briefTxt.indexOf('再折戟 1 次') >= 0, briefTxt.match(/再折戟[^；。<]*/)?.[0].slice(0, 28) || '未出现');
    }
    // F4 罗盘徽记：触屏没有 hover，点一下要能念出含义（新玩家看到「🧭 3」不会知道是什么）
    await load('/index.html?dev=1&p=f4#demo=0,4,5');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => { try { return w.__tm && w.Engine.state(); } catch (e) { return null; } }, 10000);
    await wait(500);
    {
      const dlH = d.getElementById('dialogOverlay');
      for (let i = 0; i < 8; i++) { if (!dlH.classList.contains('show')) break; dlH.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
      const sr = w.Engine.state();
      sr.flags.rings = (sr.flags.rings || []).concat(['scout2']);
      w.__tm.refreshHud();
      await wait(200);
      const pip = d.getElementById('compassPip');
      const shown = pip && !pip.hidden;
      if (shown) pip.click();
      await wait(300);
      const warnTxt = (d.getElementById('warnPill') || {}).textContent || '';
      rec('F4 罗盘徽记点一下能念出含义', shown && warnTxt.indexOf('罗盘') >= 0, shown ? (warnTxt.slice(0, 26) || '无提示') : '徽记未显示');
    }

    // ===== E. 成就墙与死亡页（前一版新增内容） =====
    // E1 榜单页成就计数是「死数字」还是入口：点一下应关榜开图鉴（成就墙住在图鉴里）
    await load('/index.html?dev=1&p=e1');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => { try { return w.__tm && w.__tm.openBoard; } catch (e) { return null; } }, 10000);
    await wait(400);
    {
      w.__tm.openBoard();
      await wait(400);
      const ach = d.getElementById('achCount');
      rec('E1 成就计数可点击（有入口光标）', !!ach && getComputedStyle(ach).cursor === 'pointer', ach ? 'cursor=' + getComputedStyle(ach).cursor : '缺失');
      if (ach) {
        ach.click();
        // 图鉴正文 19k 字符（含 35 张成就卡），固定 400ms 偶发读空 → 等渲染完再断言（防 flaky）
        await waitFor(() => {
          const el = d.getElementById('colBody');
          return el && el.querySelectorAll('.ach-card').length > 0;
        }, 4000);
        await wait(120);
        const colOpen = d.getElementById('collectionOverlay').classList.contains('show');
        const boardClosed = !d.getElementById('boardOverlay').classList.contains('show');
        rec('E2 点成就计数 → 图鉴打开且榜单关', colOpen && boardClosed, `图鉴${colOpen ? '开' : '没开'} · 榜单${boardClosed ? '已关' : '还开着'}`);
        const colEl = d.getElementById('colBody');
        const achTxt = (colEl || {}).textContent || '';
        const dbgLen = colEl ? (colEl.innerHTML || '').length : -1;
        const sub0 = colEl && colEl.querySelector('.ach-sub');
        const subCodes = sub0 ? Array.from(sub0.textContent.slice(0, 4)).map((c) => c.codePointAt(0).toString(16)).join(' ') : 'none';
        rec('E2b 图鉴正文有内容', dbgLen > 500, 'ach-card ' + (colEl ? colEl.querySelectorAll('.ach-card').length : -1) + ' 张 · 首个分组字符码 ' + subCodes);
        rec('E3 成就墙四区都在（战斗/收藏/誓约/折戟）', ['战 斗', '收 藏', '誓 约', '折 戟'].every((t) => achTxt.indexOf(t) >= 0),
          ['战斗', '收藏', '誓约', '折戟'].filter((t, i) => achTxt.indexOf(['战 斗', '收 藏', '誓 约', '折 戟'][i]) < 0).join(',') || '四区齐全');
        // 折戟灰卡给解锁条件（desc 即条件）——新玩家点🔒卡也能知道「要死几次」
        const fallCard = d.querySelector('.ach-card[data-ach="fall3"]');
        const fallText = fallCard ? fallCard.textContent : '';
        rec('E4 折戟灰卡自带解锁条件', !!fallCard && /折戟 3 次|累计折戟/.test(fallText + (fallCard.title || '')), fallCard ? (fallCard.title || fallText).slice(0, 30) : '缺失');
      }
    }
    // E5 死亡面板折戟行：新玩家第一次死，能从结算页看懂「折戟 ×N · 上次倒在第 M 层」吗
    await load('/index.html?dev=1&p=e5#demo=0,4,5');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => { try { return w.__tm && w.__tm.showDeath && w.Engine.state(); } catch (e) { return null; } }, 10000);
    await wait(400);
    {
      // 有 state（demo 锚已开局）：点掉开场教学后把状态摆成死亡，调 showDeath
      const dlE = d.getElementById('dialogOverlay');
      for (let i = 0; i < 8; i++) { if (!dlE.classList.contains('show')) break; dlE.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(50); }
      const s = w.Engine.state();
      s.over = true; s.hp = 0; s.floor = 8; s.flags.killCount = 37; s.flags.vow = 'guard';
      w.__tm.showDeath({ name: '钟妖' }, 1225);
      await wait(400);
      const stats = (d.getElementById('endStats') || {}).textContent || '';
      rec('E5 死亡结算有「倒在谁」与「折戟塔印」', /倒在/.test(stats) && /折戟/.test(stats), (stats.match(/倒在[^<]*|折戟[^<]*/g) || []).join(' ').slice(0, 40));

      // E6/E7 焦点 B 二轮：死亡页默认收起履历（刚死只想重开），但必须一眼能找到入口
      const mem = d.getElementById('endMemory');
      const tg = d.querySelector('.mem-toggle');
      const memHidden = mem ? getComputedStyle(mem).display === 'none' : null;
      rec('E6 死亡页履历默认收起', memHidden === true, 'endMemory display=' + (mem ? getComputedStyle(mem).display : '缺失'));
      rec('E7 有「塔的记忆」展开入口', !!tg && /塔的记忆/.test(tg.textContent), tg ? tg.textContent.trim() : '缺失');
      if (tg) {
        tg.click();
        await wait(250);
        const opened = mem ? getComputedStyle(mem).display !== 'none' && mem.classList.contains('open') : false;
        rec('E8 点开能展开履历', opened, 'open=' + (mem && mem.classList.contains('open')));
        const body = d.getElementById('endBody');
        rec('E9 死亡页无空白正文带', !body || getComputedStyle(body).display === 'none', body ? 'display=' + getComputedStyle(body).display : '无节点');
      }

      // E10/E11 首局结算提示：第一局没立过誓，结算时得告诉玩家「下一局多了个选择」；
      // 已经立过誓的局不该再念这句（会变成噪音）
      {
        // 前面的 D 场景（showEnd）已经 recordRun 过一次，runs 不再是 0——
        // 这里显式摆回「从没进过塔」，否则读到的是被污染的状态（首版就踩了这个）
        w.__tm.Meta.memory.runs = 0;
        const s0 = w.Engine.state();
        s0.over = false;
        d.getElementById('endOverlay').classList.remove('show', 'death-mode');
        w.__tm.deathAgain({ name: '钟妖' }, 1225);   // deathAgain 会清 deathShown，否则 showDeath 直接 return
        await wait(350);
        const nv0 = d.getElementById('nextVow');
        const chips0 = nv0 ? nv0.querySelectorAll('.nv-chip') : [];
        rec('E10 首局死亡结算有「下一局可立誓」预告卡', !!nv0 && !nv0.hidden && /下一局开局可以立誓/.test(nv0.textContent) && chips0.length === 4, `hidden=${nv0 ? nv0.hidden : '缺失'} chips=${chips0.length}`);
        // 造一个「已经进过 3 次塔」的档案再死一次：这句提示不该再出现
        w.__tm.Meta.memory.runs = 3;
        const s2 = w.Engine.state();
        s2.over = false; s2.hp = 0;
        d.getElementById('endOverlay').classList.remove('show', 'death-mode');
        w.__tm.deathAgain({ name: '钟妖' }, 1225);
        await wait(350);
        const nv1 = d.getElementById('nextVow');
        rec('E11 老玩家死亡结算不再显示预告卡', !!nv1 && nv1.hidden === true, `hidden=${nv1 ? nv1.hidden : '缺失'}`);
      }
    }

    // ===== F. 首局节奏：塔友榜 / 立誓面板按局数分级开放 =====
    {
      await load('/index.html?dev=1&p=f0');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.__tm.openVow);
      await wait(300);
      w.localStorage.removeItem('towermates_meta');
      w.localStorage.removeItem('towermates_save_v3');
      w.localStorage.removeItem('towermates_save_v5');
      await load('/index.html?p=f1');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.__tm.openVow);
      await wait(300);
      const b1 = d.getElementById('btnBoard'), b2 = d.getElementById('btnBoard2');
      rec('F1 首局不露塔友榜入口', b1.style.display === 'none' && b2.style.display === 'none', `顶栏=${b1.style.display || '显示'} 开始页=${b2.style.display || '显示'}`);
      const startBtns = Array.from(d.querySelectorAll('#startOverlay button')).filter((b) => b.offsetParent !== null && b.id !== 'btnContinue');
      rec('F1b 首屏只剩「开始游戏」', startBtns.length === 1 && startBtns[0].id === 'btnNew', startBtns.map((b) => b.id || b.textContent.trim()).join(',') || '无');
      w.__tm.openVow();
      await wait(300);
      const cards0 = d.querySelectorAll('#vowCards .vow-card');
      const chips0 = d.querySelectorAll('#vowLocked .vow-chip');
      rec('F2 首局立誓只有 1 张确认卡', cards0.length === 1 && cards0[0].dataset.vow === 'none' && chips0.length === 0, `卡 ${cards0.length} / chip ${chips0.length}`);
      const em0 = d.getElementById('vowEmber'), en0 = d.getElementById('vowEmberNote');
      rec('F3 首局不露余烬行', em0.hidden === true && en0.hidden === true, `余额=${em0.hidden} 注释=${en0.hidden}`);
      // 造一份「进过塔」的档 → 塔友榜与四张誓约回来
      const raw0 = JSON.parse(w.localStorage.getItem('towermates_meta') || '{}');
      raw0.memory = Object.assign({}, raw0.memory || {}, { runs: 1 });
      w.localStorage.setItem('towermates_meta', JSON.stringify(raw0));
      await load('/index.html?dev=1&p=f2');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.__tm.openVow);
      await wait(300);
      const b1b = d.getElementById('btnBoard');
      w.__tm.openVow();
      await wait(300);
      rec('F4 第二局起恢复塔友榜与四张誓约', b1b.style.display !== 'none' && d.querySelectorAll('#vowCards .vow-card').length === 4, `顶栏=${b1b.style.display || '显示'} 卡 ${d.querySelectorAll('#vowCards .vow-card').length}`);
      // F7 本地漏斗：首局开始 / 结束各记一条（接 SDK 前先把节点跑通）
      w.localStorage.removeItem('towermates_meta');
      w.localStorage.removeItem('towermates_funnel');
      await load('/index.html?dev=1&p=f7');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.__tm.openVow);
      await wait(300);
      w.__tm.openVow();
      await wait(250);
      const vcF7 = d.querySelector('#vowCards .vow-card[data-vow="none"]');
      if (vcF7) vcF7.click();
      await wait(500);
      const dlF7 = d.getElementById('dialogOverlay');
      for (let i = 0; i < 10; i++) { if (!dlF7.classList.contains('show')) break; dlF7.dispatchEvent(new MouseEvent('click', { bubbles: true })); await wait(80); }
      await wait(300);
      const sF7 = w.Engine.state();
      sF7.over = true; sF7.hp = 0; sF7.floor = 1;
      w.Engine.save();
      w.__tm.showDeath({ name: '史莱姆' }, 90);
      await wait(400);
      const fl = JSON.parse(w.localStorage.getItem('towermates_funnel') || '[]');
      const evs = fl.map((x) => x.ev);
      const st7 = fl.find((x) => x.ev === 'run_start');
      rec('F7 漏斗缓冲记下首局开始与结束', evs.indexOf('run_start') >= 0 && evs.indexOf('run_end') >= 0 && !!st7 && st7.sinceLoad >= 0, `事件=${evs.join(',')} 加载→开局=${st7 ? st7.sinceLoad : '—'}s`);
      // F8 有存档时首屏只推「继续游戏」，开新局折成一行小字
      await load('/index.html?p=f8');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.__tm.openVow);
      await wait(300);
      const bn8 = d.getElementById('btnNew'), bc8 = d.getElementById('btnContinue'), nr8 = d.getElementById('newRunRow');
      rec('F8 有存档时首屏只推「继续游戏」', bn8.style.display === 'none' && bc8.style.display !== 'none' && nr8.style.display !== 'none', `新局=${bn8.style.display || '显示'} 继续=${bc8.style.display || '显示'} 开新局=${nr8.style.display || '显示'}`);
      // F9 退出节点：pagehide 要落一条 page_hide
      w.dispatchEvent(new w.Event('pagehide'));
      const fl9 = JSON.parse(w.localStorage.getItem('towermates_funnel') || '[]');
      rec('F9 漏斗记下 page_hide', fl9.some((x) => x.ev === 'page_hide'), fl9.map((x) => x.ev).join(',') || '空');
      // F10 调试页：?funnel=1 渲染时间线
      await load('/index.html?funnel=1&p=f9');
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.__tm.openVow);
      await wait(400);
      const fv = d.getElementById('funnelView');
      rec('F10 ?funnel=1 渲染本机漏斗', !!fv && /本机漏斗/.test(fv.textContent) && /run_start/.test(fv.textContent), fv ? fv.textContent.slice(0, 30).replace(/\s+/g, ' ') : '缺失');
      // F11 筛选：关键（开局+结算）/ 退出，行数要和存档里的条数对上
      const fl11 = JSON.parse(w.localStorage.getItem('towermates_funnel') || '[]');
      const keyN = fl11.filter((x) => x.ev === 'run_start' || x.ev === 'run_end').length;
      const hideN = fl11.filter((x) => x.ev === 'page_hide').length;
      const chipKey = d.querySelector('#funnelView [data-f="key"]');
      const chipHide = d.querySelector('#funnelView [data-f="hide"]');
      if (chipKey) chipKey.click();
      await wait(150);
      const rowsKey = d.querySelectorAll('#funnelView .fv-row').length;
      if (chipHide) chipHide.click();
      await wait(150);
      const rowsHide = d.querySelectorAll('#funnelView .fv-row').length;
      rec('F11 漏斗页筛选（关键/退出）', rowsKey === keyN && rowsHide === hideN, `关键 ${rowsKey}/${keyN} · 退出 ${rowsHide}/${hideN}`);

    }

    // ===== G. 商店折叠不藏能力（焦点 C 三轮）=====
    await load('/index.html?dev=1&p=g1#demo=2,4,6');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => { try { return w.__tm && w.__tm.openShop && w.Engine.state(); } catch (e) { return null; } }, 10000);
    await wait(500);
    {
      const st = w.Engine.state();
      st.gold = 500;
      st.flags.hasBlock = false;
      delete st.flags.shopExpanded;
      w.__tm.openShop();
      await wait(500);
      const list0 = d.getElementById('shopList');
      const items0 = list0 ? Array.from(list0.querySelectorAll('.shop-item')) : [];
      const rows0 = items0.length;
      // 只读首屏行，不含底部「更多货」那行（那行文案里就写着「含半部盾谱」）
      const hasBook0 = items0.some((n) => /半部盾谱/.test(n.textContent || ''));
      rec('G1 未学格挡时盾谱留在首屏', hasBook0, `首屏 ${rows0} 行 · 含盾谱 ${hasBook0 ? 'Y' : 'N'}`);
      rec('G2 首屏不超 5 行（折叠仍然生效）', rows0 > 0 && rows0 <= 5, '行数 ' + rows0);
      d.getElementById('shopClose').click();
      await wait(250);

      // 已学格挡：盾谱不该再占首屏（它有 owned 态，但折叠后连行都不该有）
      w.Engine.state().flags.hasBlock = true;
      delete w.Engine.state().flags.shopExpanded;
      w.__tm.openShop();
      await wait(500);
      const list1 = d.getElementById('shopList');
      const items1 = list1 ? Array.from(list1.querySelectorAll('.shop-item')) : [];
      const hasBook1 = items1.some((n) => /半部盾谱/.test(n.textContent || ''));
      rec('G3 已学格挡时盾谱退回折叠', !hasBook1 && items1.length > 0, `首屏 ${items1.length} 行 · 含盾谱 ${hasBook1 ? 'Y' : 'N'}`);
      const more = d.querySelector('.si-more, #shopMore, .shop-more');
      rec('G4 有「更多货」展开入口', !!more, more ? (more.textContent || '').trim().slice(0, 28) : '缺失');
    }

    out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n')
      + '\n\n' + (R.every((r) => r.ok) ? 'ALL PASS' : 'HAS FAIL');
    document.title = (R.every((r) => r.ok) ? 'ALLPASS|' : 'HASFAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
  } catch (e) {
    out.textContent = 'HARNESS: ' + e.message + '\n' + (e.stack || '');
    document.title = 'ERR|' + e.message;
  }
})();
</script>
</body>
</html>
