<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>intro-check</title>
<style>
body{margin:0;background:#05070c;color:#8ef;font:12.5px/1.6 monospace}
#f{width:430px;height:640px;border:0;display:block}
#out{padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="out">running…</pre>
<script>
// 序章只播一次：首次进塔要播；进过塔（memory.runs>0）再开一局不该再挡一次对白
const f = document.getElementById('f');
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const R = [];
function rec(name, ok, note) {
  R.push({ name, ok: !!ok, note: note || '' });
  out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n');
  document.title = (R.every((r) => r.ok) ? 'ALLPASS|' : 'HASFAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
}
async function waitFor(fn, timeout = 8000, step = 20) {
  const t0 = performance.now();
  while (performance.now() - t0 < timeout) {
    let v = null;
    try { v = fn(); } catch (e) {}
    if (v) return v;
    await wait(step);
  }
  return null;
}
function load(url) {
  return new Promise((res) => { f.onload = () => res(); f.src = url; });
}

(async () => {
  try {
    // ---------- A. 首次进塔：应播序章 ----------
    await load('/index.html?dev=1&p=i1');
    let w = f.contentWindow, d = f.contentDocument;
    await waitFor(() => w.__tm && w.Engine && w.Engine.state && w.__tm.openVow);
    await wait(500);
    {
      w.localStorage.removeItem('towermates_meta');
      w.localStorage.removeItem('towermates_save_v5');
      w.localStorage.removeItem('towermates_save');
      const mem = w.__tm.Meta.memory;
      rec('A0 初始进塔次数为 0', (mem.runs || 0) === 0, 'runs=' + (mem.runs || 0));
      w.__tm.openVow();
      await wait(400);
      w.__tm.chooseVow('none');
      await wait(500);
      const dlg = d.getElementById('dialogOverlay');
      rec('A1 首次开局播序章', dlg.classList.contains('show'), '对白遮罩=' + dlg.classList.contains('show'));
      // 点掉 4 段对白
      for (let i = 0; i < 10 && dlg.classList.contains('show'); i++) {
        dlg.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await wait(120);
      }
      await wait(600);
      rec('A2 序章读完进入第 1 层', d.getElementById('floorCard') !== null && (w.Engine.state().floor === 0), 'floor=' + w.Engine.state().floor);
    }

    // ---------- B. 进过塔（runs>0）：再开一局不该播 ----------
    await load('/index.html?dev=1&p=i2');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => w.__tm && w.Engine && w.Engine.state && w.__tm.openVow);
    await wait(500);
    {
      // 造一个「进过 3 次塔」的档案（等价于死过两次通关过一次）
      const raw = JSON.parse(w.localStorage.getItem('towermates_meta') || '{}');
      raw.memory = Object.assign({}, raw.memory || {}, { runs: 3 });
      w.localStorage.setItem('towermates_meta', JSON.stringify(raw));
      await load('/index.html?dev=1&p=i3');   // 重载让 Meta 读到新档
      w = f.contentWindow; d = f.contentDocument;
      await waitFor(() => w.__tm && w.Engine && w.Engine.state && w.__tm.openVow);
      await wait(500);
      rec('B0 读到进塔次数', (w.__tm.Meta.memory.runs || 0) === 3, 'runs=' + w.__tm.Meta.memory.runs);

      w.__tm.openVow();
      await wait(400);
      w.__tm.chooseVow('none');
      await wait(700);
      const dlg = d.getElementById('dialogOverlay');
      rec('B1 老玩家开局不再播序章', dlg.classList.contains('show') === false, '对白遮罩=' + dlg.classList.contains('show'));
      rec('B2 直接落在第 1 层', w.Engine.state().floor === 0 && !w.Engine.state().over, 'floor=' + w.Engine.state().floor);
      const logs = d.getElementById('log');
      rec('B3 日志说明可重看', /序章/.test(logs.textContent || ''), (logs.textContent || '').slice(0, 40).replace(/\s+/g, ' '));
    }

    // ---------- C. 设置里的「重看序章」能播 ----------
    {
      const btn = d.getElementById('cfgStory');
      rec('C1 设置里有重看序章入口', !!btn, btn ? btn.textContent.trim() : '缺失');
      if (btn) {
        w.__tm.openCfg();
        await wait(300);
        btn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await wait(500);
        const dlg = d.getElementById('dialogOverlay');
        rec('C2 点了能播序章', dlg.classList.contains('show'), '对白遮罩=' + dlg.classList.contains('show'));
      }
    }

    out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n')
      + '\n\n' + (R.every((r) => r.ok) ? 'ALL PASS' : 'HAS FAIL');
    document.title = (R.every((r) => r.ok) ? 'ALLPASS|' : 'HASFAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
  } catch (e) {
    out.textContent = 'HARNESS: ' + e.message + '\n' + (e.stack || '');
    document.title = 'ERR|' + e.message;
  }
})();
</script>
</body>
</html>
