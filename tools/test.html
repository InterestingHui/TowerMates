<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>auto test</title></head>
<body style="margin:0;background:#05070c">
<iframe id="f" src="/index.html" style="width:430px;height:900px;border:0"></iframe>
<script>
  // 开发用：自动开局，可选直接跳状态；按键 U/D/L/R、E 确认、X 取消、T 点对白
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  f.onload = function () {
    var w = f.contentWindow, d = f.contentDocument;
    setTimeout(function () {
      var st = d.createElement('style');
      st.textContent = '*{animation:none!important;transition:none!important}';
      d.head.appendChild(st);
      // 加速打字机：直接把 interval 间隔调小（通过劫持 advanceDialog 前先快进）
      var btn = d.getElementById('btnNew');
      if (btn) btn.click();

      if (q.get('slow')) w.__battleSpeed = Number(q.get('slow'));
      var spec = q.get('state');
      if (spec) {
        var p = spec.split(',').map(Number);
        var s = w.Engine.state();
        s.floor = p[0];
        s.x = p[1];
        s.y = p[2];
        if (p[3] !== undefined) s.flags.journal = !!p[3];
      }
      if (q.get('click')) {
        var cp = q.get('click').split(',').map(Number);
        setTimeout(function () {
          var cv = d.getElementById('game');
          var r = cv.getBoundingClientRect();
          var size = r.width / 11;
          cv.dispatchEvent(new MouseEvent('click', {
            bubbles: true,
            clientX: r.left + (cp[0] + 0.5) * size,
            clientY: r.top + (cp[1] + 0.5) * size,
          }));
        }, 1500);
        setTimeout(function () {
          var st = w.Engine.state();
          var cv = d.getElementById('game');
          var r = cv.getBoundingClientRect();
          var size = r.width / 11;
          var el2 = d.elementFromPoint(r.left + (cp[0] + 0.5) * size, r.top + (cp[1] + 0.5) * size);
          var pth = w.Engine.pathTo(cp[0], cp[1]);
          var pre = document.createElement('pre');
          pre.id = 'dbgpos';
          pre.style.cssText = 'position:fixed;left:0;bottom:0;color:#0f0;font-size:10px;z-index:99';
          pre.textContent = 'POS ' + st.x + ',' + st.y + ' floor=' + st.floor + ' steps=' + st.steps +
            ' path=' + (pth ? pth.length : 'null') + ' rectW=' + r.width.toFixed(1) +
            ' hit=' + (el2 ? (el2.id || el2.tagName) : 'none') + ' dlg=' + d.getElementById('dialogOverlay').classList.contains('show');
          document.body.appendChild(pre);
        }, 3200);
      }
      var gold = q.get('gold');
      if (gold) w.Engine.state().gold = Number(gold);
      if (q.get('atk')) w.Engine.state().atk = Number(q.get('atk'));
      if (q.get('def')) w.Engine.state().def = Number(q.get('def'));
      if (q.get('hp')) { w.Engine.state().hp = Number(q.get('hp')); w.Engine.state().maxHp = Number(q.get('hp')); }
      if (q.get('codex') === '1') {
        w.Engine.state().flags.codex = true;
        var cb = d.getElementById('btnCodex');
        if (cb) cb.style.display = '';
      }
      if (q.get('codexui') === '1') {
        setTimeout(function () { var b = d.getElementById('btnCodex'); if (b) b.click(); }, 400);
      }
      if (q.get('buy') === 'codex') {
        var tries = 0;
        var iv2 = setInterval(function () {
          var b = d.querySelector('.si-buy[data-id="codex"]');
          if (b) { b.click(); clearInterval(iv2); }
          if (++tries > 40) clearInterval(iv2);
        }, 200);
      }

      // 序章对白自动点完
      var nIntro = (q.get('intro') || '1') * 1;
      var clicks = (q.get('clicks') || '0') * 1;

      var map = { U: 'ArrowUp', D: 'ArrowDown', L: 'ArrowLeft', R: 'ArrowRight', E: 'Enter', X: 'Escape', T: ' ' };
      var keys = (q.get('keys') || '').split('').filter(Boolean);
      // 前置：先点 nIntro 次对白（快进序章），再执行 keys，其中 T 表示点对白一次
      var seq = [];
      for (var i = 0; i < nIntro; i++) seq.push('T');
      keys.forEach(function (k) { seq.push(k); });

      var j = 0;
      var iv = setInterval(function () {
        if (j >= seq.length + clicks) {
          clearInterval(iv);
          // 结束前如需展示榜单：模拟点开
          if (q.get('board') === '1') {
            var b = d.getElementById('btnBoard');
            if (b) b.click();
          }
          return;
        }
        var act = seq[j];
        if (act === 'T') {
          // 对白显示中：第一次点=快进，第二次点=下一句；保守点 3 次每步
          var ov = d.getElementById('dialogOverlay');
          if (ov.classList.contains('show')) {
            var evt = new MouseEvent('click', { bubbles: true });
            ov.dispatchEvent(evt);
            setTimeout(function () { ov.dispatchEvent(new MouseEvent('click', { bubbles: true })); }, 60);
          }
        } else if (act) {
          w.dispatchEvent(new KeyboardEvent('keydown', { key: map[act] }));
        }
        j++;
      }, 200);
    }, 250);
  };
</script>
</body>
</html>
