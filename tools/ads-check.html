<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>ads-check</title>
<style>
body{margin:0;background:#05070c;color:#8ef;font:12.5px/1.6 monospace}
#f{width:430px;height:640px;border:0;display:block}
#out{padding:10px;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="f"></iframe>
<pre id="out">running…</pre>
<script>
// 激励视频卡点自检：Ads 默认不可用（线上零变化）+ ?ads=1 时两个卡点可走通
// 跑法：chrome --headless --dump-dom http://127.0.0.1:PORT/tools/ads-check.html
const f = document.getElementById('f');
const out = document.getElementById('out');
const now = () => performance.now();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const R = [];
function rec(name, ok, note) {
  R.push({ name, ok: !!ok, note: note || '' });
  out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n');
  document.title = (R.every((r) => r.ok) ? 'PASS|' : 'FAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
}
async function waitFor(fn, timeout = 6000, step = 10) {
  const t0 = now();
  while (now() - t0 < timeout) {
    let v = null;
    try { v = fn(); } catch (e) {}
    if (v) return v;
    await wait(step);
  }
  return null;
}
function load(url) {
  return new Promise((res) => { f.onload = () => res(); f.src = url; });
}
function clickEl(el) { el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true })); }

(async () => {
  try {
    // ---------- A. 默认（不带 ads=1）：两个卡点都不该出现 ----------
    await load('/index.html?dev=1&p=a#demo=0,2,5');
    let w = f.contentWindow, d = f.contentDocument;
    await waitFor(() => w.__tm && w.Engine && w.Engine.state());
    await wait(500);
    rec('A1 Ads 门面已加载', !!w.Ads, w.Ads ? 'slots=' + w.Ads.slots().join(',') : '缺失');
    rec('A2 默认不可用', w.Ads && w.Ads.available() === false, 'available()=' + (w.Ads && w.Ads.available()));

    {
      const s = w.Engine.state();
      s.over = true; s.hp = 0; s.floor = 4; s.flags.killCount = 12;
      w.__tm.showDeath({ name: '测试怪' }, 99);
      await wait(300);
      const btn = d.querySelector('#btnAdRevive');
      rec('A3 默认死亡页无广告按钮', !btn, btn ? '出现了！' : '干净');
      d.getElementById('endOverlay').classList.remove('show', 'death-mode');
      s.over = false; s.hp = s.maxHp || 1000;
    }

    // ---------- B. ?ads=1：死亡 → 复活 ----------
    await load('/index.html?ads=1&dev=1&p=b#demo=0,2,5');
    w = f.contentWindow; d = f.contentDocument;
    await waitFor(() => w.__tm && w.Engine && w.Engine.state());
    await wait(500);
    rec('B1 ads=1 时可用', w.Ads && w.Ads.available() === true, 'available()=' + (w.Ads && w.Ads.available()));

    {
      const s = w.Engine.state();
      s.over = true; s.hp = 0; s.floor = 4; s.flags.killCount = 12;
      w.__tm.showDeath({ name: '测试怪' }, 99);
      await wait(400);
      const btn = d.querySelector('#btnAdRevive');
      rec('B2 死亡页出现复活按钮', !!btn, btn ? btn.textContent.trim() : '没有');
      if (btn) {
        const hpBefore = w.Engine.state().hp;
        clickEl(btn);
        const closed = await waitFor(() => !d.getElementById('endOverlay').classList.contains('show'), 4000);
        const s2 = w.Engine.state();
        rec('B3 点复活→结算面板关闭', !!closed, '');
        rec('B4 复活后 over=false', s2.over === false, 'over=' + s2.over + ' hp=' + s2.hp);
        rec('B5 血量回到四成', s2.hp === Math.max(1, Math.round((s2.maxHp || 1000) * 0.4)), `hp=${s2.hp} max=${s2.maxHp}`);
        rec('B6 记下复活次数', s2.flags.adRevived >= 1, 'adRevived=' + s2.flags.adRevived);
        rec('B7 重开一局按钮还在（不叠按钮）', d.querySelectorAll('#btnAdRevive').length <= 1, 'count=' + d.querySelectorAll('#btnAdRevive').length);
      }
    }

    // ---------- C. ?ads=1：结算 → 余烬翻倍 ----------
    {
      const s = w.Engine.state();
      const before = w.__tm.Meta.ember;
      s.ending = 'plain';
      s.won = true;
      s.floor = 11;
      s.flags.killCount = 40;
      try { w.__tm.showEnd(); } catch (e) { rec('C0 showEnd 调用', false, e.message); }
      await wait(500);
      const btn = d.querySelector('.ad-cta-inline');
      rec('C1 结算页出现翻倍按钮', !!btn, btn ? btn.textContent.trim().slice(0, 24) : '没有');
      if (btn) {
        clickEl(btn);
        await wait(600);
        const after = w.__tm.Meta.ember;
        const done = d.querySelector('.ad-done');
        rec('C2 点击后余烬增加', after > before, `${before} → ${after}`);
        rec('C3 按钮换成已入账标记', !!done, done ? done.textContent.trim() : '没有');
      }
    }

    out.textContent = R.map((r) => `${r.ok ? '✓' : '✗'} ${r.name}${r.note ? ' — ' + r.note : ''}`).join('\n')
      + '\n\n' + (R.every((r) => r.ok) ? 'ALL PASS' : 'HAS FAIL');
    document.title = (R.every((r) => r.ok) ? 'ALLPASS|' : 'HASFAIL|') + R.map((r) => (r.ok ? '1' : '0')).join('');
  } catch (e) {
    out.textContent = 'HARNESS: ' + e.message + '\n' + (e.stack || '');
    document.title = 'ERR|' + e.message;
  }
})();
</script>
</body>
</html>
