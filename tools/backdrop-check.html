<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>backdrop-check</title>
<style>
  body{margin:0;background:#05070c;color:#8ef;font:12px/1.5 monospace;padding:12px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .cell{background:#0a0e15;border:1px solid #1b2433;border-radius:8px;overflow:hidden;position:relative}
  .cell .frame{width:100%;aspect-ratio:430/900;overflow:hidden;position:relative}
  .cell svg{width:100%;height:100%;display:block}
  .cap{position:absolute;left:6px;top:6px;background:#000a;padding:1px 6px;border-radius:4px;color:#e8c46a;z-index:2}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="../js/backdrops.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const only = (q.get('only') || '').split(',').filter(Boolean);
  const keys = only.length ? only : ['gate','corridor','market','passage','wolfhall','throne','ridge','empty','bell','namewall','carve','roof','core','dawn'];
  if (only.length) document.getElementById('grid').style.gridTemplateColumns = 'repeat(' + only.length + ',1fr)';
  const g = document.getElementById('grid');
  keys.forEach((k) => {
    const c = document.createElement('div');
    c.className = 'cell';
    const f = document.createElement('div');
    f.className = 'frame';
    f.innerHTML = window.Backdrops.svg(k);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = k;
    c.appendChild(f); c.appendChild(cap);
    g.appendChild(c);
  });
  // 叠一条对话框占位，模拟真实排版（下半屏被压住）
  if (only.length) {
    document.querySelectorAll('.frame').forEach((f) => {
      const box = document.createElement('div');
      box.style.cssText = 'position:absolute;left:12px;right:12px;bottom:14px;height:132px;border-radius:12px;'
        + 'background:linear-gradient(180deg,rgba(18,23,33,.97),rgba(9,12,18,.97));border:1px solid #2a3346;z-index:3';
      f.appendChild(box);
    });
  }
  document.title = 'backdrops=' + keys.filter((k) => !!window.Backdrops.svg(k)).length;
</script>
</body>
</html>
